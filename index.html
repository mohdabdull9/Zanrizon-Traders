<style>
:root{
 --primary:#173b63;--primary2:#0f2945;--accent:#d6a84f;--bg:#f4f6f8;--card:#fff;
 --text:#182230;--muted:#667085;--line:#e4e7ec;--ok:#18864b;--warn:#b7791f;--danger:#c53b37;
 --r:12px;--shadow:0 6px 22px rgba(15,41,69,.08);--ok-bg:#eaf7ef;--warn-bg:#fff6e6;--danger-bg:#fff0ef;
}
html[data-theme="dark"]{
 --primary:#4f8fd1;--primary2:#0b1420;--accent:#e8bd6f;--bg:#0d1520;--card:#141d2c;
 --text:#e8eef6;--muted:#93a4bb;--line:#243247;--ok:#3fcf8e;--warn:#f0ac45;--danger:#f2716a;
 --shadow:0 10px 30px rgba(0,0,0,.45);--ok-bg:#0f2a20;--warn-bg:#2e2410;--danger-bg:#2e1615;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,system-ui,-apple-system,Segoe UI,sans-serif;transition:background .25s ease,color .25s ease}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
::selection{background:var(--accent);color:var(--primary2)}

/* ---------- Login / Register ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr .9fr;background:var(--card)}
.loginHero{background:linear-gradient(150deg,var(--primary2),var(--primary));color:#fff;padding:70px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.loginHero::before{content:'';position:absolute;inset:0;background-image:repeating-linear-gradient(115deg,rgba(255,255,255,.04) 0 2px,transparent 2px 46px);}
.heroIn{max-width:560px;position:relative;z-index:1;animation:fadeUp .6s ease both}
.logo{width:62px;height:62px;border-radius:16px;background:var(--accent);color:var(--primary2);display:grid;place-items:center;font-weight:900;font-size:25px;margin-bottom:25px}
.heroIn h1{font-size:42px;line-height:1.05;margin:0 0 14px}
.heroIn p{color:#d9e5f2;line-height:1.7;font-size:16px}
.features{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:28px}
.feature{padding:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:10px;transition:transform .15s}
.feature:hover{transform:translateY(-2px)}
.loginBox{display:flex;align-items:center;justify-content:center;padding:35px}
.panel{width:100%;max-width:400px;animation:fadeUp .5s ease both}
.panel h2{font-size:28px;margin:0 0 7px}
.muted{color:var(--muted)}
.authTabs{display:flex;gap:6px;margin-bottom:22px;background:var(--bg);padding:4px;border-radius:10px}
.authTabs button{flex:1;border:0;background:none;padding:9px;border-radius:8px;font-weight:700;color:var(--muted)}
.authTabs button.active{background:var(--card);color:var(--primary);box-shadow:var(--shadow)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 11px;background:var(--card);color:var(--text);outline:none;transition:border-color .15s,box-shadow .15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(214,168,79,.15)}

.btn{border:1px solid var(--line);background:var(--card);color:var(--text);padding:9px 13px;border-radius:9px;font-weight:700;transition:.15s}
.btn:hover{border-color:var(--primary);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.gold{background:var(--accent);color:var(--primary2);border-color:var(--accent)}
.danger{background:var(--danger-bg);color:var(--danger);border-color:var(--danger-bg)}
.success{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-bg)}
.small{padding:6px 9px;font-size:12px}
.wide{width:100%}

/* ---------- App shell ---------- */
.app{display:flex;min-height:100vh}
.side{width:245px;background:var(--primary2);color:#fff;padding:17px 13px;display:flex;flex-direction:column;flex-shrink:0;transition:width .2s}
.brand{display:flex;align-items:center;gap:10px;padding:7px 7px 18px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:14px}
.brand .logo{width:40px;height:40px;border-radius:10px;font-size:15px;margin:0}
.brand b{font-size:14px}
.brand small{display:block;color:#b9cce0;margin-top:3px}
.nav{display:flex;flex-direction:column;gap:3px;overflow:auto}
.nav button{border:0;background:transparent;color:#d3dfeb;text-align:left;padding:10px 11px;border-radius:8px;display:flex;align-items:center;gap:9px;transition:background .12s,color .12s}
.nav button:hover{background:rgba(255,255,255,.1);color:#fff}
.nav button.active{background:var(--accent);color:var(--primary2);font-weight:800}
.nav .badge{margin-left:auto;background:var(--danger);color:#fff;font-size:10.5px;padding:1px 7px;border-radius:20px}
.sideBottom{margin-top:auto;border-top:1px solid rgba(255,255,255,.1);padding-top:12px;display:flex;flex-direction:column;gap:3px}
.sideBottom button{border:0;background:none;color:#d3dfeb;padding:10px;text-align:left;border-radius:8px;display:flex;gap:9px;align-items:center}
.sideBottom button:hover{background:rgba(255,255,255,.1);color:#fff}
.main{flex:1;min-width:0}
.top{height:66px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;gap:15px;position:sticky;top:0;z-index:5;transition:background .25s}
.topSearch{max-width:480px;flex:1;position:relative}
.topSearch input{width:100%;padding:11px 14px 11px 38px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text)}
.topSearch span{position:absolute;left:13px;top:10px;color:var(--muted)}
.user{display:flex;align-items:center;gap:12px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-weight:800;color:var(--primary)}
.themeBtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--bg)}
.content{padding:24px;max-width:1600px;margin:auto;animation:fadeUp .35s ease both}
.pageHead{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px;flex-wrap:wrap}
.pageHead h1{font-size:25px;margin:0}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;gap:15px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);margin-bottom:16px;transition:background .25s,border-color .25s}
.cardHead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:15px;flex-wrap:wrap}
.cardHead h3{margin:0;font-size:16px}
.cardHead p{margin:4px 0 0;color:var(--muted);font-size:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);transition:transform .15s}
.kpi:hover{transform:translateY(-2px)}
.kpi .label{font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:800;letter-spacing:.04em}
.kpi .value{font-size:25px;font-weight:850;margin-top:8px;color:var(--primary)}
.kpi .sub{font-size:11px;color:var(--muted);margin-top:5px}
.ok{color:var(--ok)!important}.bad{color:var(--danger)!important}.warn{color:var(--warn)!important}

.tableWrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:720px}
th{font-size:11px;color:var(--muted);text-transform:uppercase;text-align:left;border-bottom:2px solid var(--line);padding:9px;white-space:nowrap}
td{padding:10px 9px;border-bottom:1px solid var(--line);vertical-align:middle}
tr{transition:background .12s}
tr:hover td{background:rgba(128,128,128,.04)}
tr:last-child td{border-bottom:0}
.num{font-variant-numeric:tabular-nums}
.tag{display:inline-block;border-radius:30px;padding:4px 8px;font-size:11px;font-weight:800}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.low{background:var(--warn-bg);color:var(--warn)}
.tag.out{background:var(--danger-bg);color:var(--danger)}
.formGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:13px;align-items:end}
.formActions{display:flex;gap:8px;align-items:end}
.searchLine{display:flex;gap:9px;align-items:center;margin-bottom:13px}
.searchLine input{flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--text)}
.notice{padding:12px 14px;border-radius:9px;background:var(--bg);color:var(--muted);margin-bottom:15px}
.notice.warn{background:var(--warn-bg);color:var(--warn)}
.empty{text-align:center;color:var(--muted);padding:35px!important;font-style:italic}
.right{text-align:right}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.chart{height:200px;display:flex;align-items:flex-end;gap:10px;padding:15px 5px 26px;border-bottom:1px solid var(--line)}
.bar{flex:1;min-width:8px;background:var(--primary);border-radius:6px 6px 0 0;position:relative;transition:height .4s ease}
.bar span{position:absolute;bottom:-22px;width:100%;font-size:10px;text-align:center;color:var(--muted)}
.bar i{position:absolute;top:-17px;left:0;width:100%;font-size:10px;text-align:center;font-style:normal;color:var(--text)}
.barcodeBox{display:flex;align-items:center;gap:15px;flex-wrap:wrap}
.barcode-svg{background:#fff;border:1px solid var(--line);border-radius:6px;padding:4px}
.modalBack{position:fixed;inset:0;background:rgba(10,18,30,.55);display:grid;place-items:center;padding:20px;z-index:20;animation:fadeIn .15s ease both}
.modal{background:var(--card);border-radius:14px;width:min(720px,100%);max-height:90vh;overflow:auto;padding:20px;animation:pop .18s ease both}
.hidden{display:none!important}
.receipt{max-width:400px;margin:auto}
.receipt h2{text-align:center}
.receipt table{min-width:0}
.toast{position:fixed;right:20px;bottom:20px;background:var(--primary);color:#fff;padding:12px 16px;border-radius:10px;box-shadow:var(--shadow);z-index:30;animation:slideIn .2s ease both}
.scanner{border:2px dashed var(--line);padding:14px;border-radius:10px;text-align:center}
#reader{border-radius:10px;overflow:hidden}
.posGrid{display:grid;grid-template-columns:1.35fr .65fr;gap:15px}
.cartLine{display:grid;grid-template-columns:1fr 70px 100px 34px;gap:7px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.cartLine input{padding:7px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--text)}
.totalBox{background:var(--bg);border-radius:10px;padding:13px}
.footerNote{font-size:11px;color:var(--muted);text-align:center;margin-top:25px}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin .7s linear infinite;margin:40px auto}
.pillRow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.pill{padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:var(--card);font-size:12.5px;font-weight:700;color:var(--muted)}
.pill.active{background:var(--primary);color:#fff;border-color:var(--primary)}

@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
@keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}

.hamburger{display:inline-flex;border:0;background:none;color:var(--text);font-size:20px;padding:6px 10px;border-radius:8px;cursor:pointer}
.hamburger:hover{background:rgba(128,128,128,.12)}
.side{overflow-y:auto}
.side.collapsed{width:74px}
.side.collapsed .brand>div:last-child,.side.collapsed .nav button span:last-child,.side.collapsed .sideBottom button span:last-child{display:none}
.side.collapsed .brand{justify-content:center}
.sideOverlay{display:none}

@media(max-width:1000px){.g6{grid-template-columns:repeat(3,1fr)}.posGrid{grid-template-columns:1fr}.topSearch{max-width:360px}}
@media(max-width:900px){
  .side{position:fixed;left:-260px;top:0;bottom:0;z-index:50;transition:left .22s ease;width:245px!important;box-shadow:0 0 30px rgba(0,0,0,.3)}
  .side.mobileOpen{left:0}
  .side.collapsed{width:245px!important}
  .side.collapsed .brand>div:last-child,.side.collapsed .nav button span:last-child,.side.collapsed .sideBottom button span:last-child{display:block}
  .side.collapsed .brand{justify-content:flex-start}
  .sideOverlay.show{display:block;position:fixed;inset:0;background:rgba(10,18,30,.5);z-index:45}
  .main{width:100%}
}
@media(max-width:700px){.login{grid-template-columns:1fr}.loginHero{display:none}.content{padding:12px}.top{padding:0 10px}.g2,.g3,.g4,.g6{grid-template-columns:1fr 1fr}.topSearch{display:none}
  .posGrid{grid-template-columns:1fr}
  .cartLine{grid-template-columns:1fr;gap:4px;padding:11px 0}
  .cartLine>*{width:100%}
  .formGrid{grid-template-columns:1fr}
  .kpi .value{font-size:20px}
  table{min-width:600px}
  .pageHead h1{font-size:20px}
}
@media(max-width:480px){.g2,.g3,.g4,.g6{grid-template-columns:1fr}}
@media print{.side,.top,.noPrint{display:none!important}.content{padding:0}.card{box-shadow:none;border:0}.receipt{max-width:none}.modalBack{position:static;background:#fff;padding:0}}
</style>

<body>
<div id="root"><div class="spinner"></div></div>
<div id="modal" class="modalBack hidden"></div>
<div id="toast" class="toast hidden"></div>

<script>
/* ============================================================================
   UNIVERSAL BUSINESS MANAGER — multi-tenant edition (Supabase backed)
   See DEPLOY_INSTRUCTIONS.md for setup. Fill in SUPABASE_URL / SUPABASE_ANON_KEY
   at the top of this file before use.
   ============================================================================ */

const sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

let session=null, me=null, business=null, view='login', authMode='login';
let cache={shops:[],categories:[],products:[],stock:{},sales:[],saleLines:[],purchases:[],transfers:[],adjustments:[],expenses:[],activity:[],members:[]};
let storeFilter='all', search='', cart=[], editing=null, scanner=null, registerBusy=false;
let reportMonth=new Date().getMonth()+1, reportYear=new Date().getFullYear();
let sidebarCollapsed=localStorage.getItem('ubm_sidebar_collapsed')==='1';
let mobileSidebarOpen=false;
function toggleSidebar(){
  if(window.innerWidth<=900){ mobileSidebarOpen=!mobileSidebarOpen; }
  else { sidebarCollapsed=!sidebarCollapsed; localStorage.setItem('ubm_sidebar_collapsed', sidebarCollapsed?'1':'0'); }
  applySidebarState();
}
function applySidebarState(){
  const side=document.querySelector('.side'), overlay=document.getElementById('sideOverlay');
  if(!side) return;
  side.classList.toggle('collapsed', sidebarCollapsed && window.innerWidth>900);
  side.classList.toggle('mobileOpen', mobileSidebarOpen && window.innerWidth<=900);
  if(overlay) overlay.classList.toggle('show', mobileSidebarOpen && window.innerWidth<=900);
}
function closeMobileSidebar(){ if(window.innerWidth<=900){ mobileSidebarOpen=false; applySidebarState(); } }

/* ---------------- generic helpers ---------------- */
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(n){return Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})+' '+(business?.currency||'USD')}
function dateOnly(d=new Date()){return new Date(d).toISOString().slice(0,10)}
function timeNow(){return new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}
function roleName(r){return {owner:'Owner',manager:'Manager',inventory:'Main Store Operator',cashier:'Cashier'}[r]||r}
function can(r){return me&&(me.role==='owner'||me.role===r||(me.role==='manager'&&['inventory','cashier'].includes(r)))}
function makeBarcode(){return '2'+Date.now().toString().slice(-9)+Math.floor(Math.random()*10)}
function norm(s){return String(s??'').trim().replace(/\s+/g,'').toLowerCase()}
function product(codeOrBarcode){const v=norm(codeOrBarcode); if(!v) return null; return cache.products.find(p=>norm(p.code)===v||norm(p.barcode)===v)}
function productById(id){return cache.products.find(p=>p.id===id)}
function shopObj(id){return cache.shops.find(s=>s.id===id)}
function stock(shopId,code){return Number(cache.stock[shopId]?.[code]||0)}
function setStockLocal(shopId,code,q){cache.stock[shopId]=cache.stock[shopId]||{};cache.stock[shopId][code]=Math.max(0,Number(q||0))}
function statusTag(q){return q<=0?'<span class="tag out">Out</span>':q<=business.low_stock?'<span class="tag low">Low</span>':'<span class="tag ok">In stock</span>'}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(window.__toastT);window.__toastT=setTimeout(()=>t.classList.add('hidden'),2600)}
function visibleStores(){return cache.shops.filter(s=>me.role!=='cashier'||s.id===me.shop_id)}

async function persistStock(shopId,code,qty){
  const p=product(code); if(!p) return;
  await sb.from('stock_levels').upsert({business_id:me.business_id,shop_id:shopId,product_id:p.id,qty:Math.max(0,qty)});
}
async function logActivity(type,description){
  await sb.from('activity_log').insert({business_id:me.business_id,type,description,by_name:me.name});
  cache.activity.push({type,description,by_name:me.name,created_at:new Date().toISOString()});
}

/* ---------------- boot / auth ---------------- */
async function boot(){
  const {data:{session:s}}=await sb.auth.getSession();
  session=s;
  if(session) await loadMember(); else render();
}
async function loadMember(){
  const {data:m}=await sb.from('members').select('*').eq('auth_user_id',session.user.id).maybeSingle();
  if(!m){ me=null; view='register'; render(); return; }
  me=m;
  document.documentElement.setAttribute('data-theme', me.theme||'light');
  const {data:b}=await sb.from('businesses').select('*').eq('id',m.business_id).single();
  business=b;
  await loadAllData();
  view = me.role==='cashier' ? 'pos' : 'dashboard';
  render();
}
async function loadAllData(){
  const [shops,categories,products,stockRows,sales,saleLines,purchases,transfers,adjustments,expenses,activity,members] = await Promise.all([
    sb.from('shops').select('*').order('created_at'),
    sb.from('categories').select('*').order('name'),
    sb.from('products').select('*').order('name'),
    sb.from('stock_levels').select('*'),
    sb.from('sales').select('*').order('created_at',{ascending:false}),
    sb.from('sale_lines').select('*'),
    sb.from('purchases').select('*').order('created_at',{ascending:false}),
    sb.from('transfers').select('*').order('created_at',{ascending:false}),
    sb.from('adjustments').select('*').order('created_at',{ascending:false}),
    sb.from('expenses').select('*').order('created_at',{ascending:false}),
    sb.from('activity_log').select('*').order('created_at',{ascending:false}).limit(60),
    sb.from('members').select('*'),
  ]);
  cache.shops=shops.data||[]; cache.categories=categories.data||[]; cache.products=products.data||[];
  cache.sales=sales.data||[]; cache.saleLines=saleLines.data||[]; cache.purchases=purchases.data||[];
  cache.transfers=transfers.data||[]; cache.adjustments=adjustments.data||[]; cache.expenses=expenses.data||[];
  cache.activity=activity.data||[]; cache.members=members.data||[];
  cache.stock={};
  (stockRows.data||[]).forEach(r=>{const p=cache.products.find(x=>x.id===r.product_id); if(p){cache.stock[r.shop_id]=cache.stock[r.shop_id]||{};cache.stock[r.shop_id][p.code]=r.qty;}});
  if(cache.categories.length===0){ cache.categories=[{name:'General'}]; }
}
function linesFor(saleId){return cache.saleLines.filter(l=>l.sale_id===saleId)}

async function loginSubmit(e){
  e.preventDefault();
  const idf=document.getElementById('lu').value.trim(), pass=document.getElementById('lp').value;
  const err=document.getElementById('loginErr'); err.textContent='';
  let email=idf;
  if(!idf.includes('@')){
    const {data}=await sb.from('username_directory').select('email').eq('username',idf.toLowerCase()).maybeSingle();
    if(!data){ err.textContent='No account found with that username.'; return; }
    email=data.email;
  }
  const {error}=await sb.auth.signInWithPassword({email,password:pass});
  if(error){ err.textContent='Incorrect username/email or password.'; return; }

async function registerSubmit(e){
  e.preventDefault();
  if(registerBusy) return; registerBusy=true;
  const err=document.getElementById('regErr'); err.textContent='';
  const bizName=document.getElementById('rb').value.trim();
  const ownerName=document.getElementById('rn').value.trim();
  const email=document.getElementById('re').value.trim();
  const pass=document.getElementById('rp').value, pass2=document.getElementById('rp2').value;
  if(pass!==pass2){ err.textContent='Passwords do not match.'; registerBusy=false; return; }
  if(pass.length<6){ err.textContent='Password must be at least 6 characters.'; registerBusy=false; return; }
  const {data:signData,error:signErr}=await sb.auth.signUp({email,password:pass});
  if(signErr){ err.textContent=signErr.message; registerBusy=false; return; }
  if(!signData.session){
    err.textContent=''; toast('Check your email to confirm your account, then sign in.');
    authMode='login'; render(); registerBusy=false; return;
  }
  session=signData.session;
  const {data:biz,error:bizErr}=await sb.from('businesses').insert({name:bizName, short:bizName.slice(0,3).toUpperCase(), owner_auth_id:session.user.id}).select().single();
  if(bizErr){ err.textContent=bizErr.message; registerBusy=false; return; }
  const {error:memErr}=await sb.from('members').insert({business_id:biz.id, auth_user_id:session.user.id, name:ownerName, role:'owner'});
  if(memErr){ err.textContent=memErr.message; registerBusy=false; return; }
  await sb.from('shops').insert({business_id:biz.id, name:'Main Store', type:'warehouse'});
  await sb.from('categories').insert([{business_id:biz.id,name:'General'},{business_id:biz.id,name:'Food & Beverage'},{business_id:biz.id,name:'Household'}]);
  toast('Business registered! Setting up your dashboard…');
  registerBusy=false;
  await loadMember();
}

function dashboard(){

  const low=[]; cache.shops.forEach(st=>cache.products.forEach(p=>{const q=stock(st.id,p.code); if(q<=business.low_stock) low.push({st,p,q});}));
  const units=cache.products.reduce((a,p)=>a+cache.shops.reduce((b,s)=>b+stock(s.id,p.code),0),0);
  const top=[...cache.products].map(p=>({p,n:linesForProduct(p.code).reduce((a,l)=>a+Number(l.qty),0)})).sort((a,b)=>b.n-a.n).slice(0,6);
  return `<div class="grid g4"><div class="kpi"><div class="label">Today's sales</div><div class="value">${money(rev)}</div><div class="sub">${sales.length} transaction(s)</div></div><div class="kpi"><div class="label">All-time sales</div><div class="value">${money(allRev)}</div></div><div class="kpi"><div class="label">Products</div><div class="value">${cache.products.length}</div><div class="sub">${units} units across locations</div></div><div class="kpi"><div class="label">Stock alerts</div><div class="value ${low.length?'bad':''}">${low.length}</div><div class="sub">Low / out of stock</div></div></div>

  <div class="grid g2"><div class="card"><div class="cardHead"><div><h3>Low stock alerts</h3><p>Across all stores and shops</p></div><button class="btn small" onclick="go('inventory')">View inventory</button></div>${low.slice(0,10).map(x=>`<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)"><span>${esc(x.p.name)} <small class="muted">· ${esc(x.st.name)}</small></span><span class="tag ${x.q?'low':'out'}">${x.q} left</span></div>`).join('')||'<p class="muted">Everything is sufficiently stocked.</p>'}</div>
  <div class="card"><div class="cardHead"><div><h3>Recent activity</h3><p>Latest system movements</p></div></div>${cache.activity.slice(0,8).map(a=>`<div style="padding:8px 0;border-bottom:1px solid var(--line)"><b>${esc(a.description)}</b><div class="muted" style="font-size:11px">${esc(new Date(a.created_at).toLocaleString())} · ${esc(a.by_name)}</div></div>`).join('')||'<p class="muted">No activity yet.</p>'}</div></div>`;
}
function linesForProduct(code){const p=product(code); if(!p) return []; return cache.saleLines.filter(l=>l.product_id===p.id)}
function salesChart(){let vals=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const ds=dateOnly(d);vals.push({d:ds,v:cache.sales.filter(s=>s.date===ds).reduce((a,s)=>a+Number(s.total),0)})}const max=Math.max(...vals.map(x=>x.v),1);return `<div class="chart">${vals.map(x=>`<div class="bar" style="height:${Math.max(5,x.v/max*90)}%"><i>${x.v?Math.round(x.v).toLocaleString():''}</i><span>${x.d.slice(5)}</span></div>`).join('')}</div>`}

async function saveProduct(e){
  e.preventDefault();
  const code=document.getElementById('pc').value.trim();
  const obj={code, name:document.getElementById('pn').value.trim(), category:document.getElementById('pct').value, unit:document.getElementById('pu').value.trim()||'unit', cost:Number(document.getElementById('pco').value), price:Number(document.getElementById('pp').value), barcode:document.getElementById('pb').value.trim()||makeBarcode(), tax:Number(document.getElementById('pt').value)||0, active:true, business_id:me.business_id};
  if(!editing && product(code)){ toast('SKU already exists'); return; }
  let error;
  if(editing){ const p=product(editing); ({error}=await sb.from('products').update(obj).eq('id',p.id)); if(!error) Object.assign(p,obj); }
  else { const {data,error:e2}=await sb.from('products').insert(obj).select().single(); error=e2; if(!error) cache.products.push(data); }
  if(error){ toast(error.message.includes('duplicate')?'That SKU or barcode already exists.':error.message); return; }
  await logActivity('product', editing?'Product updated: '+obj.name:'Product created: '+obj.name);
  closeModal(); renderView(); toast('Product saved');
}

function posProducts(q){

function scanLookup(value){
  value=String(value||'').trim();

function openScanConfirm(p){
  const shop=shopObj(activeShopId()); const available=stock(shop.id,p.code);
  document.getElementById('modal').innerHTML=`<div class="modal"><div class="cardHead"><div><h3>Confirm item</h3><p>Review quantity and price before adding it to the sale.</p></div><button class="btn" onclick="closeModal()">✕</button></div>

  <form id="confirmForm" class="formGrid" style="margin-top:18px"><div class="field"><label>Quantity</label><input id="cfQty" type="number" min="1" max="${available}" value="1" required></div><div class="field"><label>Unit price</label><input id="cfPrice" type="number" min="0" step=".01" value="${p.price}" required></div><div class="field"><button class="btn primary wide" ${available<=0?'disabled':''}>Add to sale</button></div></form></div>`;

function changeCart(i,v){

async function completeSale(){

  const receipt='R-'+Date.now().toString().slice(-7);
  const {data:sale,error}=await sb.from('sales').insert({business_id:me.business_id,shop_id:sid,receipt,date:dateOnly(),time:timeNow(),subtotal,tax,total,payment:document.getElementById('pay')?.value||'Cash',customer:document.getElementById('customerName')?.value.trim()||'Walk-in',cashier_name:me.name}).select().single();

  await sb.from('sale_lines').insert(lineRows);
  cache.sales.unshift(sale); cache.saleLines.push(...lineRows);
  for(const l of cart){ setStockLocal(sid,l.code,stock(sid,l.code)-l.qty); await persistStock(sid,l.code,stock(sid,l.code)); }
  await logActivity('sale',`Sale ${receipt}: ${money(total)} at ${shopObj(sid)?.name}`);

/* ---- Camera barcode scanning (html5-qrcode) ---- */
function openCameraModal(){
  document.getElementById('modal').innerHTML=`<div class="modal"><div class="cardHead"><div><h3>Camera barcode scanner</h3><p>Point the camera at a printed barcode. Allow camera access if prompted.</p></div><button class="btn" onclick="closeModal()">✕</button></div><div id="reader" style="width:100%;min-height:260px"></div><div id="cameraStatus" class="muted" style="margin-top:10px;text-align:center">Starting camera…</div>
  <form id="manualScanForm" class="searchLine" style="margin-top:14px"><input id="manualScanInput" placeholder="Camera not working? Type the barcode/SKU here"><button class="btn">Look up</button></form></div>`;
  document.getElementById('modal').classList.remove('hidden');
  const mf=document.getElementById('manualScanForm');
  mf.addEventListener('submit',(e)=>{ e.preventDefault(); const v=document.getElementById('manualScanInput').value.trim(); if(v){ stopCameraScan(); closeModal(); scanLookup(v); } });
  startCameraScan();
}
function startCameraScan(){
  if(!window.Html5Qrcode){ document.getElementById('cameraStatus').textContent='Camera scanner library failed to load.'; return; }
  if(scanner) return;
  let fired=false;
  scanner=new Html5Qrcode('reader', {
    formatsToSupport:[
      Html5QrcodeSupportedFormats.CODE_128, Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.UPC_A, Html5QrcodeSupportedFormats.UPC_E, Html5QrcodeSupportedFormats.CODE_39,
      Html5QrcodeSupportedFormats.QR_CODE
    ],
    verbose:false
  });
  const onDecode=(decodedText)=>{
    if(fired) return; fired=true;
    const st=document.getElementById('cameraStatus'); if(st) st.textContent='Detected: '+decodedText;
    stopCameraScan(); closeModal(); scanLookup(decodedText);
  };
  const tryStart=(constraints)=>scanner.start(constraints, {fps:12, qrbox:{width:260,height:160}}, onDecode, ()=>{});
  tryStart({facingMode:{ideal:'environment'}})
    .then(()=>{ const st=document.getElementById('cameraStatus'); if(st) st.textContent='Scanning… hold the barcode flat and steady in the frame.'; })
    .catch(()=>{
      // fall back to any available camera (some laptops/tablets have no "environment" camera)
      tryStart({facingMode:'user'})
        .then(()=>{ const st=document.getElementById('cameraStatus'); if(st) st.textContent='Scanning with front camera… hold the barcode steady.'; })
        .catch(()=>{ const st=document.getElementById('cameraStatus'); if(st) st.textContent='Camera unavailable — check browser permissions (padlock icon in the address bar), or type the code manually below.'; });
    });
}
function stopCameraScan(){
  if(scanner){ scanner.stop().then(()=>scanner.clear()).catch(()=>{}); scanner=null; }
}

/* ---------------- REPORTS ---------------- */
function monthName(m){return ['January','February','March','April','May','June','July','August','September','October','November','December'][m-1]}
function salesInRange(fromDate,toDate){return cache.sales.filter(s=>s.date>=fromDate && s.date<=toDate)}
function salesInMonth(y,m){const from=`${y}-${String(m).padStart(2,'0')}-01`; const to=`${y}-${String(m).padStart(2,'0')}-31`; return salesInRange(from,to)}
function salesInYear(y){return salesInRange(`${y}-01-01`,`${y}-12-31`)}
function bestSellers(salesList,limit=10){
  const saleIds=new Set(salesList.map(s=>s.id));
  const lines=cache.saleLines.filter(l=>saleIds.has(l.sale_id));
  const byCode={};
  lines.forEach(l=>{ byCode[l.code]=byCode[l.code]||{code:l.code,name:l.name,qty:0,revenue:0}; byCode[l.code].qty+=Number(l.qty); byCode[l.code].revenue+=Number(l.qty)*Number(l.price); });
  return Object.values(byCode).sort((a,b)=>b.qty-a.qty).slice(0,limit);
}
function reportSummary(salesList){
  const saleIds=new Set(salesList.map(s=>s.id));
  const lines=cache.saleLines.filter(l=>saleIds.has(l.sale_id));
  const rev=salesList.reduce((a,s)=>a+Number(s.total),0);
  const gross=lines.reduce((a,l)=>a+Number(l.qty)*(Number(l.price)-(productById(l.product_id)?.cost||0)),0);
  return {rev,gross,count:salesList.length};
}
function lowStockRows(){
  const rows=[];
  cache.shops.forEach(st=>cache.products.forEach(p=>{ const q=stock(st.id,p.code); if(q<=business.low_stock) rows.push({shop:st.name,name:p.name,code:p.code,qty:q}); }));
  return rows.sort((a,b)=>a.qty-b.qty);
}
function setReportPeriod(field,val){ if(field==='month') reportMonth=Number(val); else reportYear=Number(val); renderView(); }
function reportsView(){
  const monthSales=salesInMonth(reportYear,reportMonth), yearSales=salesInYear(reportYear);
  const monthSum=reportSummary(monthSales), yearSum=reportSummary(yearSales);
  const monthExpenses=cache.expenses.filter(e=>e.date>=`${reportYear}-${String(reportMonth).padStart(2,'0')}-01`&&e.date<=`${reportYear}-${String(reportMonth).padStart(2,'0')}-31`).reduce((a,e)=>a+Number(e.amount),0);
  const monthTop=bestSellers(monthSales,8), yearTop=bestSellers(yearSales,8);
  const low=lowStockRows();
  const yearsAvailable=[...new Set(cache.sales.map(s=>Number(s.date.slice(0,4))))]; if(!yearsAvailable.includes(reportYear)) yearsAvailable.push(reportYear); yearsAvailable.sort();
  return `<div class="card noPrint"><div class="cardHead"><div><h3>Report period</h3><p>Choose the month and year to report on. Printing includes everything below.</p></div></div>
  <div class="formGrid"><div class="field"><label>Month</label><select onchange="setReportPeriod('month',this.value)">${Array.from({length:12},(_,i)=>i+1).map(m=>`<option value="${m}" ${m===reportMonth?'selected':''}>${monthName(m)}</option>`).join('')}</select></div>
  <div class="field"><label>Year</label><select onchange="setReportPeriod('year',this.value)">${yearsAvailable.map(y=>`<option value="${y}" ${y===reportYear?'selected':''}>${y}</option>`).join('')}</select></div></div></div>

  <div class="card"><div class="cardHead"><div><h3>${monthName(reportMonth)} ${reportYear} — Monthly Report</h3><p>Revenue, profit and expenses for the selected month</p></div></div>
  <div class="grid g4"><div class="kpi"><div class="label">Revenue</div><div class="value">${money(monthSum.rev)}</div><div class="sub">${monthSum.count} transaction(s)</div></div>
  <div class="kpi"><div class="label">Gross profit*</div><div class="value ok">${money(monthSum.gross)}</div></div>
  <div class="kpi"><div class="label">Expenses</div><div class="value bad">${money(monthExpenses)}</div></div>
  <div class="kpi"><div class="label">Net (rev − exp)</div><div class="value">${money(monthSum.rev-monthExpenses)}</div></div></div></div>

  <div class="grid g2">
  <div class="card"><div class="cardHead"><div><h3>Best-selling products — ${monthName(reportMonth)} ${reportYear}</h3><p>Ranked by units sold this month</p></div></div>
  ${monthTop.length?`<div class="tableWrap"><table><thead><tr><th>#</th><th>Product</th><th>Units sold</th><th>Revenue</th></tr></thead><tbody>${monthTop.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.name)}</td><td class="num">${x.qty}</td><td>${money(x.revenue)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">No sales recorded this month.</p>'}</div>

  <div class="card"><div class="cardHead"><div><h3>Best-selling products — ${reportYear} (year to date)</h3><p>Ranked by units sold across the whole year</p></div></div>
  ${yearTop.length?`<div class="tableWrap"><table><thead><tr><th>#</th><th>Product</th><th>Units sold</th><th>Revenue</th></tr></thead><tbody>${yearTop.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.name)}</td><td class="num">${x.qty}</td><td>${money(x.revenue)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">No sales recorded this year.</p>'}</div>
  </div>

  <div class="card"><div class="cardHead"><div><h3>${reportYear} — Yearly Summary</h3></div></div>
  <div class="grid g3"><div class="kpi"><div class="label">Revenue (year)</div><div class="value">${money(yearSum.rev)}</div></div><div class="kpi"><div class="label">Gross profit (year)*</div><div class="value ok">${money(yearSum.gross)}</div></div><div class="kpi"><div class="label">Transactions (year)</div><div class="value">${yearSum.count}</div></div></div>
  <div style="margin-top:14px">${Array.from({length:12},(_,i)=>i+1).map(m=>{const s=reportSummary(salesInMonth(reportYear,m));return `<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)"><span>${monthName(m)}</span><b>${money(s.rev)}</b></div>`}).join('')}</div></div>

  <div class="card"><div class="cardHead"><div><h3>Low stock report</h3><p>Every product at or below the low-stock threshold (${business.low_stock} units), across all locations — current snapshot</p></div></div>
  ${low.length?`<div class="tableWrap"><table><thead><tr><th>Product</th><th>SKU</th><th>Location</th><th>Qty left</th><th>Status</th></tr></thead><tbody>${low.map(r=>`<tr><td>${esc(r.name)}</td><td class="mono">${esc(r.code)}</td><td>${esc(r.shop)}</td><td class="num">${r.qty}</td><td>${statusTag(r.qty)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">Everything is sufficiently stocked.</p>'}</div>

  <div class="card"><div class="cardHead"><div><h3>Sales by location</h3><p>All-time, all recorded sales</p></div></div>${cache.shops.map(s=>{const x=cache.sales.filter(a=>a.shop_id===s.id).reduce((a,b)=>a+Number(b.total),0);return `<div style="display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)"><span>${esc(s.name)}</span><b>${money(x)}</b></div>`}).join('')}</div>
  <div class="card"><div class="cardHead"><div><h3>Management notes</h3><p>*Gross profit is estimated from product cost at the time of reporting. A production-grade version should store cost layers/COGS per sale.</p></div></div></div>`;
}

/* ---------------- STAFF ACCOUNTS ---------------- */
function usersView(){
  const roles=me.role==='owner' ? ['manager','inventory','cashier','owner'] : ['manager','inventory','cashier'];
  return `<div class="card"><div class="cardHead"><div><h3>Staff accounts</h3><p>Create separate logins for managers, main store operators and cashiers. Each login only ever sees this business.</p></div></div>
  <div class="tableWrap"><table><thead><tr><th>Name</th><th>Username</th><th>Role</th><th>Assigned location</th><th></th></tr></thead><tbody>${cache.members.map(u=>`<tr><td>${esc(u.name)}</td><td class="mono">${esc(u.username||'(owner login)')}</td><td>${roleName(u.role)}</td><td>${esc(shopObj(u.shop_id)?.name||'All locations')}</td><td>${u.id!==me.id?`<button class="btn small" onclick="editMember('${u.id}')">Edit</button> <button class="btn small danger" onclick="deleteMember('${u.id}')">Remove</button>`:'<span class="muted">You</span>'}</td></tr>`).join('')}</tbody></table></div></div>
  <div class="card"><div class="cardHead"><div><h3>Add staff account</h3><p>They'll sign in with the username and password you set here — no email needed.</p></div></div>
  <form id="memberForm" class="formGrid"><div class="field"><label>Full name</label><input id="mn" required></div><div class="field"><label>Username</label><input id="mu" required></div><div class="field"><label>Password</label><input id="mp" type="password" required minlength="6"></div><div class="field"><label>Role</label><select id="mr">${roles.map(r=>`<option value="${r}">${roleName(r)}</option>`).join('')}</select></div><div class="field" id="memberShopField"><label>Assigned shop (cashiers only)</label><select id="ms">${cache.shops.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></div><button class="btn primary">Create account</button></form></div>`;
}
function bindMemberForm(){
  const f=document.getElementById('memberForm'); if(f) f.addEventListener('submit', addMember);
}
async function addMember(e){
  e.preventDefault();
  const name=document.getElementById('mn').value.trim();
  const username=document.getElementById('mu').value.trim().toLowerCase().replace(/\s+/g,'');
  const password=document.getElementById('mp').value;
  const role=document.getElementById('mr').value;
  const shopId=document.getElementById('ms').value;
  if(cache.members.some(u=>(u.username||'').toLowerCase()===username)){ toast('That username is already used in this business.'); return; }
  const syntheticEmail=`${username}.${me.business_id.slice(0,8)}@staff.local`;
  const tempSb=window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY, {auth:{persistSession:false, autoRefreshToken:false, storageKey:'sb-temp-'+Date.now()}});
  const {data:signData, error:signErr}=await tempSb.auth.signUp({email:syntheticEmail, password});
  if(signErr){ toast(signErr.message.includes('registered')?'That username is already taken.':signErr.message); return; }
  const row={business_id:me.business_id, auth_user_id:signData.user.id, name, username, role, shop_id: role==='cashier'?shopId:null, theme:'light'};
  const {data:member, error:memErr}=await sb.from('members').insert(row).select().single();
  if(memErr){ toast(memErr.message); return; }
  await sb.from('username_directory').insert({username, email:syntheticEmail, business_id:me.business_id});
  cache.members.push(member);
  await logActivity('staff','Staff account created: '+name+' ('+roleName(role)+')');
  renderView(); toast('Account created — share the username and password with '+name+'.');
}
function editMember(id){
  const u=cache.members.find(x=>x.id===id);
  document.getElementById('modal').innerHTML=`<div class="modal"><div class="cardHead"><h3>Edit staff account</h3><button class="btn" onclick="closeModal()">✕</button></div><form id="editMemberForm"><div class="formGrid"><div class="field"><label>Name</label><input id="eun" value="${esc(u.name)}" required></div><div class="field"><label>Role</label><select id="eur">${['manager','inventory','cashier'].map(r=>`<option value="${r}" ${u.role===r?'selected':''}>${roleName(r)}</option>`).join('')}</select></div><div class="field"><label>Assigned shop</label><select id="eus"><option value="">All locations</option>${cache.shops.map(s=>`<option value="${s.id}" ${u.shop_id===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div></div><p class="muted small" style="margin-top:10px">To change a password, remove this account and create it again.</p><button class="btn primary" style="margin-top:14px">Save changes</button></form></div>`;
  document.getElementById('modal').classList.remove('hidden');
  document.getElementById('editMemberForm').addEventListener('submit', (e)=>saveMember(e,id));
}
async function saveMember(e,id){
  e.preventDefault();
  const u=cache.members.find(x=>x.id===id);
  const patch={name:document.getElementById('eun').value.trim(), role:document.getElementById('eur').value, shop_id:document.getElementById('eus').value||null};
  const {error}=await sb.from('members').update(patch).eq('id',id);
  if(error){ toast(error.message); return; }
  Object.assign(u,patch); closeModal(); renderView(); toast('Account updated');
}
async function deleteMember(id){
  if(!confirm('Remove this staff account? They will no longer be able to sign in.')) return;
  const u=cache.members.find(x=>x.id===id);
  await sb.from('members').delete().eq('id',id);
  if(u?.username) await sb.from('username_directory').delete().eq('username',u.username);
  cache.members=cache.members.filter(x=>x.id!==id);
  renderView();
}

/* ---------------- SETTINGS ---------------- */
function settingsView(){
  return `<div class="card"><div class="cardHead"><div><h3>Business identity</h3><p>Shown across the app, receipts and printed reports.</p></div></div>
  <form id="settingsForm"><div class="formGrid"><div class="field"><label>Business name</label><input id="bn" value="${esc(business.name)}" required></div><div class="field"><label>Short name / initials</label><input id="bs" maxlength="5" value="${esc(business.short)}"></div><div class="field"><label>Currency</label><input id="bc" value="${esc(business.currency)}"></div><div class="field"><label>Default tax %</label><input id="bt" type="number" min="0" value="${business.tax}"></div><div class="field"><label>Low stock threshold</label><input id="bl" type="number" min="0" value="${business.low_stock}"></div><div class="field"><label>Phone</label><input id="bph" value="${esc(business.phone)}"></div><div class="field"><label>Email</label><input id="bem" value="${esc(business.email)}"></div><div class="field"><label>Address</label><input id="bad" value="${esc(business.address)}"></div><div class="field" style="grid-column:1/-1"><label>Receipt footer</label><input id="brf" value="${esc(business.receipt_footer)}"></div></div><button class="btn primary" style="margin-top:16px">Save settings</button></form></div>
  <div class="card"><div class="cardHead"><div><h3>Product categories</h3><p>Add categories that fit your business.</p></div></div><div class="actions">${cache.categories.map(c=>`<span class="tag ok">${esc(c.name)}</span>`).join('')}</div>
  <form id="categoryForm" class="formActions" style="margin-top:14px"><div class="field" style="flex:1"><label>New category</label><input id="newcat" required></div><button class="btn">＋ Add</button></form></div>
  <div class="card"><div class="cardHead"><div><h3>Appearance</h3><p>Dark mode applies instantly and is remembered for your account.</p></div></div><button class="btn" onclick="toggleTheme()">Toggle dark / light mode</button></div>
  <div class="card"><div class="cardHead"><div><h3>About this deployment</h3></div></div><div class="notice">This edition stores everything in your own Supabase project (Postgres + Auth), so it works from any device and supports many independent businesses safely behind row-level security. See DEPLOY_INSTRUCTIONS.md for hosting steps.</div></div>`;
}
function bindSettingsForm(){
  const f=document.getElementById('settingsForm'); if(f) f.addEventListener('submit', saveSettings);
  const c=document.getElementById('categoryForm'); if(c) c.addEventListener('submit', addCategory);
}
async function saveSettings(e){
  e.preventDefault();
  const patch={name:document.getElementById('bn').value.trim(), short:document.getElementById('bs').value.trim(), currency:document.getElementById('bc').value.trim(), tax:Number(document.getElementById('bt').value)||0, low_stock:Number(document.getElementById('bl').value)||0, phone:document.getElementById('bph').value.trim(), email:document.getElementById('bem').value.trim(), address:document.getElementById('bad').value.trim(), receipt_footer:document.getElementById('brf').value.trim()};
  const {error}=await sb.from('businesses').update(patch).eq('id',business.id);
  if(error){ toast(error.message); return; }
  Object.assign(business,patch); render(); toast('Settings saved');
}
async function addCategory(e){
  e.preventDefault();
  const name=document.getElementById('newcat').value.trim(); if(!name) return;
  const {data,error}=await sb.from('categories').insert({business_id:me.business_id,name}).select().single();
  if(error){ toast(error.message.includes('duplicate')?'That category already exists.':error.message); return; }
  cache.categories.push(data); renderView();
}
function myStockView(){ storeFilter=me.shop_id; return inventoryView(); }

bindViewEvents=function(){
  _origBind();
  bindAdjForm(); bindStoresForm(); bindTransferForm(); bindPurchaseForm(); bindExpenseForm(); bindMemberForm(); bindSettingsForm(); bindPosEvents();
};
