<style>
:root{
 --ink:#0A1A44;--primary:#1D3FB8;--primary-2:#2F5BEA;--primary-soft:#EEF2FF;--accent:#14C8B0;--accent-2:#11A7D9;
 --bg:#F5F7FB;--card:#FFFFFF;--text:#0F172A;--muted:#64748B;--line:#E6EAF2;--line-2:#D7DDE8;
 --ok:#0E9F6E;--warn:#C27803;--danger:#DC2626;--ok-bg:#E8F8F1;--warn-bg:#FFF7E6;--danger-bg:#FEEFEF;--info-bg:#EAF4FF;
 --r:14px;--shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px rgba(16,24,40,.06);--shadow-lg:0 20px 50px rgba(10,26,68,.18);
 --side:#0A1A44;--side-2:#12255E;--side-text:#B9C5E6;
}
html[data-theme="dark"]{
 --primary:#6D8BFF;--primary-2:#89A1FF;--primary-soft:#1A2550;--accent:#2EE6C5;--bg:#0B1120;--card:#121A2E;--text:#E7ECF7;--muted:#93A0BC;
 --line:#222D47;--line-2:#2C3A5B;--ok:#34D399;--warn:#FBBF24;--danger:#F87171;--ok-bg:#0E2A22;--warn-bg:#2E2410;--danger-bg:#311616;--info-bg:#132544;
 --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);--side:#070D1C;--side-2:#101A35;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 "Plus Jakarta Sans",Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg.i{width:18px;height:18px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Consolas,monospace}
.muted{color:var(--muted)}
.hidden{display:none!important}
::selection{background:var(--accent);color:var(--ink)}

/* ---------- brand ---------- */
.mark{width:42px;height:42px;flex-shrink:0;display:block}
.word{font-weight:800;letter-spacing:-.02em;font-size:20px}
.word b{color:var(--accent)}

/* ---------- auth ---------- */
.auth{min-height:100vh;display:grid;grid-template-columns:1.1fr .9fr;background:var(--card)}
.authHero{position:relative;overflow:hidden;color:#fff;padding:56px 64px;display:flex;flex-direction:column;justify-content:space-between;
 background:radial-gradient(1200px 500px at -10% -10%,#2F5BEA 0,transparent 60%),radial-gradient(700px 500px at 110% 110%,#11A7D9 0,transparent 55%),#0A1A44}
.authHero::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:28px 28px;mask-image:linear-gradient(180deg,#000,transparent 85%)}
.authHero>*{position:relative;z-index:1}
.heroBrand{display:flex;align-items:center;gap:12px}
.heroBrand .word{font-size:24px;color:#fff}
.panelBrand{display:none;align-items:center;gap:10px;margin-bottom:22px}
.heroMain h1{font-size:44px;line-height:1.08;letter-spacing:-.03em;margin:0 0 16px;max-width:560px}
.heroMain h1 span{background:linear-gradient(90deg,#2EE6C5,#7CC4FF);-webkit-background-clip:text;background-clip:text;color:transparent}
.heroMain p{color:#C8D3F0;font-size:16px;max-width:520px;margin:0}
.heroFeatures{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:30px;max-width:560px}
.heroFeature{display:flex;gap:10px;align-items:flex-start;padding:14px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(4px)}
.heroFeature svg{color:#2EE6C5;margin-top:2px}
.heroFeature b{display:block;font-size:13.5px}
.heroFeature small{color:#AFBEE3;font-size:12px}
.heroFoot{color:#8FA1CF;font-size:12px}
.authBox{display:flex;align-items:center;justify-content:center;padding:36px}
.panel{width:100%;max-width:420px;animation:up .45s ease both}
.panel h2{font-size:28px;letter-spacing:-.02em;margin:0 0 6px}
.tabs{display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:12px;margin-bottom:24px;border:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;padding:9px 6px;border-radius:9px;font-weight:700;color:var(--muted);font-size:13px}
.tabs button.active{background:var(--card);color:var(--primary);box-shadow:var(--shadow)}

/* ---------- form ---------- */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12px;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea,.input{width:100%;border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;background:var(--card);outline:none;transition:border-color .15s,box-shadow .15s}
.field input:focus,.field select:focus,.field textarea:focus,.input:focus{border-color:var(--primary);box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 15%,transparent)}
.field .hint{font-size:11.5px;color:var(--muted)}
.formGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;align-items:end}
.stack{display:flex;flex-direction:column;gap:13px}
.check{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;cursor:pointer}
.check input{margin-top:3px;width:16px;height:16px;accent-color:var(--primary)}
.check b{display:block;font-size:13.5px}
.check small{color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-2);background:var(--card);padding:9px 14px;border-radius:10px;font-weight:700;font-size:13.5px;transition:transform .12s,border-color .12s,background .12s,box-shadow .12s;white-space:nowrap}
.btn:hover{border-color:var(--primary);transform:translateY(-1px)}
.btn:active{transform:none}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.primary{background:linear-gradient(180deg,var(--primary-2),var(--primary));color:#fff;border-color:var(--primary);box-shadow:0 6px 16px color-mix(in srgb,var(--primary) 30%,transparent)}
.btn.accent{background:var(--accent);color:var(--ink);border-color:var(--accent)}
.btn.danger{background:var(--danger-bg);color:var(--danger);border-color:transparent}
.btn.success{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--primary-soft)}
.btn.small{padding:6px 10px;font-size:12px;border-radius:8px}
.btn.lg{padding:13px 18px;font-size:15px;border-radius:12px}
.btn.wide{width:100%}
.btn svg.i{width:16px;height:16px}

/* ---------- shell ---------- */
.app{display:flex;min-height:100vh}
.side{width:256px;background:linear-gradient(180deg,var(--side),var(--side-2));color:var(--side-text);padding:18px 12px;display:flex;flex-direction:column;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto;transition:width .2s}
.sideBrand{display:flex;align-items:center;gap:11px;padding:4px 8px 18px}
.sideBrand .word{color:#fff;font-size:21px}
.sideBiz{margin:0 4px 14px;padding:12px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08)}
.sideBiz b{color:#fff;display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sideBiz small{font-size:11.5px;color:#93A3CF}
.sideBiz .code{display:inline-block;margin-top:6px;font-size:10.5px;padding:2px 7px;border-radius:6px;background:rgba(46,230,197,.14);color:#5FF0D6;font-weight:700;letter-spacing:.04em}
.navSec{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:#6C7DAE;font-weight:800;padding:14px 12px 6px}
.nav button{width:100%;border:0;background:transparent;color:var(--side-text);text-align:left;padding:9px 12px;border-radius:10px;display:flex;align-items:center;gap:11px;font-weight:600;font-size:13.5px;transition:background .12s,color .12s}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.active{background:rgba(255,255,255,.12);color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
.nav .badge{margin-left:auto;background:#EF4444;color:#fff;font-size:10.5px;padding:1px 7px;border-radius:20px;font-weight:800}
.nav .badge.teal{background:var(--accent);color:var(--ink)}
.sideFoot{margin-top:auto;padding-top:12px;border-top:1px solid rgba(255,255,255,.08)}
.side.collapsed{width:76px}
.side.collapsed .word,.side.collapsed .sideBiz,.side.collapsed .navSec,.side.collapsed .nav button span,.side.collapsed .nav .badge{display:none}
.side.collapsed .nav button{justify-content:center}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:66px;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 24px;position:sticky;top:0;z-index:10}
.iconBtn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--line);background:var(--card)}
.iconBtn:hover{border-color:var(--primary)}
.topSearch{flex:1;max-width:460px;position:relative}
.topSearch svg{position:absolute;left:12px;top:11px;color:var(--muted)}
.topSearch input{width:100%;padding:10px 12px 10px 38px;border:1px solid var(--line);border-radius:10px;background:var(--bg);outline:none}
.topRight{margin-left:auto;display:flex;align-items:center;gap:10px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:12px;font-weight:700;white-space:nowrap}
.chip.teal{background:color-mix(in srgb,var(--accent) 14%,transparent);border-color:transparent;color:color-mix(in srgb,var(--accent) 60%,var(--text))}
.chip.warn{background:var(--warn-bg);border-color:transparent;color:var(--warn)}
.chip.bad{background:var(--danger-bg);border-color:transparent;color:var(--danger)}
.chip.ok{background:var(--ok-bg);border-color:transparent;color:var(--ok)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-weight:800;object-fit:cover}
.who b{display:block;font-size:13px;line-height:1.2}
.who small{color:var(--muted);font-size:11.5px}
.content{padding:26px;max-width:1500px;width:100%;margin:0 auto;animation:up .3s ease both}
.pageHead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.pageHead h1{font-size:26px;letter-spacing:-.025em;margin:0}
.pageHead p{margin:4px 0 0;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.banner{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:12px;margin-bottom:18px;border:1px solid transparent}
.banner.warn{background:var(--warn-bg);color:var(--warn)}
.banner.bad{background:var(--danger-bg);color:var(--danger)}
.banner.info{background:var(--info-bg);color:var(--primary)}
.banner.ok{background:var(--ok-bg);color:var(--ok)}
.banner b{display:block}
.banner p{margin:2px 0 0;color:var(--text);opacity:.85;font-size:13px}

/* ---------- cards ---------- */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);margin-bottom:16px;min-width:0}
.card.flat{box-shadow:none}
.cardHead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.cardHead h3{margin:0;font-size:16px;letter-spacing:-.01em}
.cardHead p{margin:3px 0 0;color:var(--muted);font-size:12.5px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0;position:relative;overflow:hidden}
.kpi .k{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--muted)}
.kpi .k .ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary)}
.kpi .k .ico.teal{background:color-mix(in srgb,var(--accent) 16%,transparent);color:color-mix(in srgb,var(--accent) 70%,var(--text))}
.kpi .k .ico.warn{background:var(--warn-bg);color:var(--warn)}
.kpi .k .ico.bad{background:var(--danger-bg);color:var(--danger)}
.kpi .v{font-size:clamp(18px,2.2vw,26px);font-weight:800;letter-spacing:-.02em;margin-top:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ok{color:var(--ok)!important}.bad{color:var(--danger)!important}.warn{color:var(--warn)!important}

.tableWrap{overflow:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;min-width:680px}
th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;text-align:left;border-bottom:1px solid var(--line);padding:10px;white-space:nowrap;font-weight:800}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover td{background:color-mix(in srgb,var(--primary) 3%,transparent)}
tr:last-child td{border-bottom:0}
.num{font-variant-numeric:tabular-nums}
.right{text-align:right}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 9px;font-size:11.5px;font-weight:800;white-space:nowrap}
.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.low,.tag.warn{background:var(--warn-bg);color:var(--warn)}.tag.out,.tag.bad{background:var(--danger-bg);color:var(--danger)}
.tag.info{background:var(--info-bg);color:var(--primary)}.tag.gray{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.empty{text-align:center;color:var(--muted);padding:34px!important}
.searchLine{display:flex;gap:9px;align-items:center;margin-bottom:14px}
.searchLine input{flex:1}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.pill{padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:12.5px;font-weight:700;color:var(--muted)}
.pill.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.pillRow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}

.chart{height:210px;display:flex;align-items:flex-end;gap:12px;padding:20px 4px 26px;border-bottom:1px solid var(--line)}
.bar{flex:1;min-width:10px;background:linear-gradient(180deg,var(--primary-2),var(--primary));border-radius:8px 8px 3px 3px;position:relative;transition:height .4s}
.bar.teal{background:linear-gradient(180deg,#2EE6C5,#11A7D9)}
.bar span{position:absolute;bottom:-22px;width:100%;font-size:10.5px;text-align:center;color:var(--muted)}
.bar i{position:absolute;top:-18px;left:-10px;right:-10px;font-size:10.5px;text-align:center;font-style:normal;font-weight:700}
.meter{height:8px;border-radius:99px;background:var(--bg);overflow:hidden;border:1px solid var(--line)}
.meter>div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:99px}

/* ---------- POS ---------- */
.posGrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(340px,.75fr);gap:16px;align-items:start}
.scanZone{border:2px dashed var(--line-2);border-radius:16px;padding:22px;text-align:center;background:linear-gradient(180deg,color-mix(in srgb,var(--primary) 4%,transparent),transparent);transition:border-color .2s,background .2s}
.scanZone.flash-ok{border-color:var(--ok);background:var(--ok-bg)}
.scanZone.flash-bad{border-color:var(--danger);background:var(--danger-bg)}
.scanZone .bigIco{width:60px;height:60px;border-radius:16px;margin:0 auto 10px;display:grid;place-items:center;background:var(--primary);color:#fff}
.scanZone .bigIco svg{width:30px;height:30px}
.scanInput{display:flex;gap:8px;margin-top:14px}
.scanInput input{flex:1;font-family:"JetBrains Mono",monospace;font-size:15px;padding:13px 14px}
.lastScan{margin-top:12px;font-size:13px;min-height:20px}
.prodGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.prodBtn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px;text-align:left;transition:border-color .12s,transform .12s}
.prodBtn:hover{border-color:var(--primary);transform:translateY(-1px)}
.prodBtn b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prodBtn small{color:var(--muted);font-size:11.5px}
.cart{position:sticky;top:84px}
.cartLine{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.cartLine .serials{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.serialChip{display:inline-flex;align-items:center;gap:4px;font:600 11px "JetBrains Mono",monospace;padding:2px 4px 2px 7px;border-radius:6px;background:var(--primary-soft);color:var(--primary)}
.serialChip button{border:0;background:none;color:inherit;padding:0 3px;font-size:13px;line-height:1}
.qtyBox{display:flex;align-items:center;border:1px solid var(--line-2);border-radius:9px;overflow:hidden}
.qtyBox button{border:0;background:var(--bg);width:28px;height:30px;font-weight:800}
.qtyBox input{width:44px;border:0;text-align:center;background:var(--card);height:30px;outline:none}
.totals{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:14px}
.totals .row{padding:5px 0;border:0}
.totals .grand{font-size:22px;font-weight:800;letter-spacing:-.02em;padding-top:10px;margin-top:6px;border-top:1px dashed var(--line-2)}
.mobileCartBar{display:none}
@media(max-width:1100px){.mobileCartBar{display:flex;position:fixed;left:12px;right:12px;bottom:12px;z-index:20;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-radius:14px;background:var(--ink);color:#fff;font-weight:800;box-shadow:var(--shadow-lg);border:0}.posGrid{padding-bottom:70px}}
.lockScreen{text-align:center;padding:40px 20px;max-width:520px;margin:0 auto}
.lockScreen .bigIco{width:72px;height:72px;border-radius:20px;margin:0 auto 16px;display:grid;place-items:center;background:var(--warn-bg);color:var(--warn)}
.lockScreen .bigIco svg{width:34px;height:34px}

/* ---------- QR labels ---------- */
.labelSheet{display:grid;gap:3mm}
.labelSheet.cols2{grid-template-columns:repeat(2,1fr)}.labelSheet.cols3{grid-template-columns:repeat(3,1fr)}.labelSheet.cols4{grid-template-columns:repeat(4,1fr)}.labelSheet.cols5{grid-template-columns:repeat(5,1fr)}
.qrLabel{border:1px dashed #A0A8B8;border-radius:6px;padding:2.5mm;background:#fff;color:#0F172A;display:flex;flex-direction:column;align-items:center;text-align:center;break-inside:avoid;page-break-inside:avoid}
.qrLabel .lbBiz{font-size:8.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#1D3FB8;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrLabel .lbName{font-size:10.5px;font-weight:700;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.qrLabel svg{width:100%;max-width:30mm;height:auto;display:block;margin:1.5mm 0}
.qrLabel .lbSerial{font:700 11px "JetBrains Mono",monospace;letter-spacing:.04em}
.qrLabel .lbMeta{font-size:8.5px;color:#475569;margin-top:1px}
.qrPreview{display:inline-block;background:#fff;padding:8px;border-radius:10px;border:1px solid var(--line)}
.qrPreview svg{display:block;width:120px;height:120px}
.barcode-svg{background:#fff;border:1px solid var(--line);border-radius:6px;padding:3px;max-width:200px}

/* ---------- modal / toast ---------- */
.modalBack{position:fixed;inset:0;background:rgba(10,18,40,.55);backdrop-filter:blur(3px);display:grid;place-items:center;padding:20px;z-index:40;animation:fade .15s ease both}
.modal{background:var(--card);border-radius:18px;width:min(760px,100%);max-height:92vh;overflow:auto;padding:24px;animation:pop .18s ease both;box-shadow:var(--shadow-lg)}
.modal.wide{width:min(1000px,100%)}
.modal.narrow{width:min(460px,100%)}
.toast{position:fixed;right:20px;bottom:20px;max-width:420px;background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;box-shadow:var(--shadow-lg);z-index:60;animation:up .2s ease both;display:flex;gap:10px;align-items:center;font-weight:600}
.toast.t-bad{background:#B91C1C}.toast.t-ok{background:#047857}
.spinner{width:36px;height:36px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--primary);animation:spin .7s linear infinite;margin:60px auto}
.receipt{max-width:340px;margin:0 auto;font-size:12.5px;color:#0F172A;background:#fff;padding:16px;border-radius:8px}
.receipt h2{text-align:center;margin:6px 0 2px;font-size:17px}
.receipt table{min-width:0}
.receipt td,.receipt th{padding:4px 0;border:0;background:#fff!important;color:#0F172A;text-transform:none;letter-spacing:0}
.receipt .dash{border-top:1px dashed #94A3B8;margin:8px 0}
.receipt .ser{font:600 10px "JetBrains Mono",monospace;color:#475569}
.receipt .qrPreview{border:0;padding:0}
.receipt .qrPreview svg{width:84px;height:84px}

@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}

.sideOverlay{display:none}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.posGrid,.split{grid-template-columns:1fr}.cart{position:static}}
@media(max-width:900px){
 .side{position:fixed;left:-270px;z-index:50;transition:left .22s;width:256px!important}
 .side.mobileOpen{left:0}
 .side.collapsed .word,.side.collapsed .sideBiz,.side.collapsed .navSec,.side.collapsed .nav button span,.side.collapsed .nav .badge{display:revert}
 .sideOverlay.show{display:block;position:fixed;inset:0;background:rgba(10,18,40,.5);z-index:45}
 .who{display:none}
}
@media(max-width:760px){
 .auth{grid-template-columns:1fr}.authHero{display:none}.panelBrand{display:flex}
 .content{padding:14px}.top{padding:0 12px}.topSearch{display:none}
 .g2,.g3{grid-template-columns:1fr}.formGrid{grid-template-columns:1fr}
 .pageHead h1{font-size:21px}.chip.hideSm{display:none}
}
@media(max-width:480px){.g4{grid-template-columns:1fr 1fr}.kpi{padding:14px}}
@media print{
 body{background:#fff}
 .side,.top,.noPrint,.toast{display:none!important}
 .content{padding:0;max-width:none}
 .card{box-shadow:none;border:0;padding:0}
 .modalBack{position:static;background:#fff;padding:0;backdrop-filter:none;display:block}
 .modal{box-shadow:none;max-height:none;overflow:visible;width:100%!important;padding:0;border-radius:0}
 body.printing-modal #root{display:none}
 @page{margin:8mm}
 .qrLabel{border-color:#ccc}
}
</style>

<div id="modal" class="modalBack hidden"></div>
<div id="toast" class="toast hidden"></div>

<script>
/* =============================================================================
   DeepQr — smart QR business management (multi-tenant, Supabase backed)
   ============================================================================= */
const sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

let session=null, me=null, business=null, view='login', authMode='login';
let isAdmin=false, adminData=null, adminTab='overview';
let dqReady=true;           // false when the DeepQr database update has not been applied yet
let account=null, platform={qr_fee:25,currency:'TZS',min_topup:1000,payment_instructions:''};
let cache={shops:[],categories:[],products:[],stock:{},sales:[],saleLines:[],purchases:[],transfers:[],adjustments:[],expenses:[],activity:[],members:[],orders:[],orderItems:[],items:[],generations:[],devices:[],topups:[],wallet:[],recs:[]};
let storeFilter='all', search='', cart=[], editing=null, scanner=null, busy=false;
let reportMonth=new Date().getMonth()+1, reportYear=new Date().getFullYear(), reportShop='all', reportType='month', reportQuarter=Math.ceil((new Date().getMonth()+1)/3);
let sidebarCollapsed=lsGet('dq_sidebar')==='1', mobileSidebarOpen=false;
let myDevice=null, expiryFilter='attention', salesFilter='all';

/* ---------------- small utilities ---------------- */
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function deviceKey(){
  let k=lsGet('dq_device_key');
  if(!k){ const a=new Uint8Array(24); (window.crypto||{}).getRandomValues?crypto.getRandomValues(a):a.forEach((_,i)=>a[i]=Math.random()*256|0); k='dqd_'+Array.from(a,b=>b.toString(16).padStart(2,'0')).join(''); lsSet('dq_device_key',k); }
  return k;
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function jsq(s){return String(s??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
function cur(){return business?.currency||platform.currency||'TZS'}
function money(n,c){const v=Number(n||0);return v.toLocaleString(undefined,{minimumFractionDigits:v%1?2:0,maximumFractionDigits:2})+' '+(c||cur())}
function pad(n){return String(n).padStart(2,'0')}
function dateOnly(d=new Date()){const x=new Date(d);return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate())}
function addDays(n){const d=new Date();d.setDate(d.getDate()+n);return dateOnly(d)}
function daysUntil(ds){if(!ds) return null; const a=new Date(ds+'T00:00:00'), b=new Date(dateOnly()+'T00:00:00'); return Math.round((a-b)/86400000)}
function timeNow(){return new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}
function fmtDT(s){return s?new Date(s).toLocaleString([], {dateStyle:'medium',timeStyle:'short'}):''}
function roleName(r){return {owner:'Owner',manager:'Manager',inventory:'Store Operator',main_operator:'Store Operator',cashier:'Cashier'}[r]||r}
function isStoreOp(){return me&&(me.role==='inventory'||me.role==='main_operator')}
function can(r){ if(!me) return false; if(me.role==='owner') return true; if(r==='owner') return false;
  if(me.role==='manager') return r!=='owner'; if(r==='inventory') return isStoreOp(); return me.role===r; }
function canQR(){return me&&['owner','manager','inventory','main_operator'].includes(me.role)}
function makeBarcode(){return '2'+Date.now().toString().slice(-9)+Math.floor(Math.random()*10)}
function norm(s){return String(s??'').trim().replace(/\s+/g,'').toLowerCase()}
function product(codeOrBarcode){const v=norm(codeOrBarcode); if(!v) return null; return cache.products.find(p=>norm(p.code)===v||norm(p.barcode)===v)}
function productById(id){return cache.products.find(p=>p.id===id)}
function shopObj(id){return cache.shops.find(s=>s.id===id)}
function stock(shopId,code){return Number(cache.stock[shopId]?.[code]||0)}
function setStockLocal(shopId,code,q){cache.stock[shopId]=cache.stock[shopId]||{};cache.stock[shopId][code]=Math.max(0,Number(q||0))}
function threshold(p){const v=p?.low_stock; return (v===null||v===undefined||v==='')?Number(business.low_stock||0):Number(v)}
function statusTag(q,p){const t=p?threshold(p):business.low_stock; return q<=0?'<span class="tag out">Out</span>':q<=t?'<span class="tag low">Low</span>':'<span class="tag ok">In stock</span>'}
function toast(msg,kind){const t=document.getElementById('toast');t.className='toast '+(kind?'t-'+kind:'');t.innerHTML=(kind==='bad'?icon('alert'):kind==='ok'?icon('check'):icon('info'))+'<span>'+esc(msg)+'</span>';clearTimeout(window.__toastT);window.__toastT=setTimeout(()=>t.classList.add('hidden'),3400)}
function visibleStores(){return cache.shops.filter(s=>me.role!=='cashier'||s.id===me.shop_id)}
function errMsg(e){const m=String(e?.message||e||'Something went wrong'); return m.replace(/^[A-Z_]+:\s*/,'')}
function beep(ok=true){try{const C=window.AudioContext||window.webkitAudioContext; if(!C) return; window.__ac=window.__ac||new C(); const o=window.__ac.createOscillator(), g=window.__ac.createGain(); o.frequency.value=ok?1250:220; o.type=ok?'sine':'square'; g.gain.value=.06; o.connect(g); g.connect(window.__ac.destination); o.start(); o.stop(window.__ac.currentTime+(ok?.09:.25)); }catch(e){}}
function liveSearch(el){const pos=el.selectionStart,id=el.id;search=el.value;renderView();const ne=document.getElementById(id);if(ne){ne.focus();try{ne.setSelectionRange(pos,pos)}catch(e){}}}
function downloadCSV(name, rows){
  const csv=rows.map(r=>r.map(c=>{const s=String(c??''); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}).join(',')).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv'})); a.download=name; document.body.appendChild(a); a.click(); a.remove();
}

function icon(n,cls=''){return `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]||''}</svg>`}
function logoMark(size=42){return `<svg class="mark" style="width:${size}px;height:${size}px" viewBox="0 0 64 64" aria-label="DeepQr"><defs><linearGradient id="lgA${size}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A1A44"/><stop offset="1" stop-color="#1D3FB8"/></linearGradient><linearGradient id="lgB${size}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2EE6C5"/><stop offset="1" stop-color="#11A7D9"/></linearGradient></defs><rect width="64" height="64" rx="15" fill="url(#lgA${size})"/><path d="M15 15h18a17 17 0 0 1 17 17v0a17 17 0 0 1-17 17H15z" fill="none" stroke="#fff" stroke-width="5.5" stroke-linejoin="round"/><rect x="22" y="23" width="14" height="18" rx="3.5" fill="url(#lgB${size})"/><rect x="45" y="45" width="6" height="6" rx="1.5" fill="#2EE6C5" opacity=".95"/><rect x="52" y="52" width="4.5" height="4.5" rx="1.2" fill="#2EE6C5" opacity=".6"/><rect x="8" y="52" width="4.5" height="4.5" rx="1.2" fill="#fff" opacity=".35"/></svg>`}
function wordmark(){return `<span class="word">Deep<b>Qr</b></span>`}

/* ---------------- QR rendering ---------------- */
function qrSvg(text, cell=4){
  if(!window.qrcode) return '<span class="muted">QR library not loaded</span>';
  const q=qrcode(0,'M'); q.addData(String(text)); q.make();
  return q.createSvgTag({cellSize:cell, margin:2, scalable:true});
}
function renderBarcodes(){
  document.querySelectorAll('.barcode-svg').forEach(el=>{
    try{ JsBarcode(el, el.dataset.barcode, {format:'CODE128', displayValue:true, height:Number(el.dataset.height)||40, width:Number(el.dataset.width)||1.6, margin:4, fontSize:11}); }catch(e){}
  });
}

/* ---------------- data persistence helpers ---------------- */
async function persistStock(shopId,code,qty){
  const p=product(code); if(!p) return;
  await sb.from('stock_levels').upsert({business_id:me.business_id,shop_id:shopId,product_id:p.id,qty:Math.max(0,qty)});
}
async function logActivity(type,description){
  await sb.from('activity_log').insert({business_id:me.business_id,type,description,by_name:me.name});
  cache.activity.unshift({type,description,by_name:me.name,created_at:new Date().toISOString()});
}

/* ---------------- boot / auth ---------------- */
async function boot(){
  try{
    const {data:{session:s}}=await sb.auth.getSession();
    session=s;
    if(session) await loadMember(); else render();
  }catch(e){ document.getElementById('root').innerHTML=`<div class="lockScreen"><div class="bigIco">${icon('alert')}</div><h2>Can't reach DeepQr</h2><p class="muted">${esc(errMsg(e))}</p><button class="btn primary" onclick="location.reload()">Try again</button></div>`; }
}
async function checkAdmin(){
  const {data,error}=await sb.rpc('dq_is_platform_admin');
  isAdmin=!error && data===true;
}
async function loadMember(){
  const {data:m}=await sb.from('members').select('*').eq('auth_user_id',session.user.id).maybeSingle();
  await checkAdmin();
  if(!m){
    me=null;
    if(isAdmin){ view='portal'; await loadAdmin(); render(); return; }
    view='register'; render(); return;
  }
  me=m;
  document.documentElement.setAttribute('data-theme', me.theme||'light');
  const {data:b}=await sb.from('businesses').select('*').eq('id',m.business_id).single();
  business=b;
  await loadAllData();
  view = me.role==='cashier' ? 'pos' : 'dashboard';
  render();
}
async function loadAllData(){
  const q=(t)=>sb.from(t).select('*');
  const [shops,categories,products,stockRows,sales,saleLines,purchases,transfers,adjustments,expenses,activity,members,orders,orderItems] = await Promise.all([
    q('shops').order('created_at'), q('categories').order('name'), q('products').order('name'), q('stock_levels'),
    q('sales').order('created_at',{ascending:false}), q('sale_lines'), q('purchases').order('created_at',{ascending:false}),
    q('transfers').order('created_at',{ascending:false}), q('adjustments').order('created_at',{ascending:false}),
    q('expenses').order('created_at',{ascending:false}), q('activity_log').order('created_at',{ascending:false}).limit(60),
    q('members'), q('orders').order('created_at',{ascending:false}), q('order_items'),
  ]);
  cache.shops=shops.data||[]; cache.categories=categories.data||[]; cache.products=products.data||[];
  cache.sales=sales.data||[]; cache.saleLines=saleLines.data||[]; cache.purchases=purchases.data||[];
  cache.transfers=transfers.data||[]; cache.adjustments=adjustments.data||[]; cache.expenses=expenses.data||[];
  cache.activity=activity.data||[]; cache.members=members.data||[]; cache.orders=orders.data||[]; cache.orderItems=orderItems.data||[];
  cache.stock={};
  (stockRows.data||[]).forEach(r=>{const p=cache.products.find(x=>x.id===r.product_id); if(p){cache.stock[r.shop_id]=cache.stock[r.shop_id]||{};cache.stock[r.shop_id][p.code]=Number(r.qty);}});
  if(cache.categories.length===0){
    const {data}=await sb.from('categories').insert({business_id:me.business_id,name:'General'}).select().single();
    cache.categories=[data||{name:'General'}];
  }
  await loadDeepQr();
}
async function loadDeepQr(){
  const [acc,set,items,gens,devs,tops,wal,recs]=await Promise.all([
    sb.from('dq_accounts').select('*').maybeSingle(),
    sb.from('platform_settings').select('*').maybeSingle(),
    sb.from('product_items').select('id,product_id,shop_id,serial,expiry_date,status,generation_id,qr_payload,batch_ref,created_at').eq('status','in_stock').limit(20000),
    sb.from('qr_generations').select('*').order('created_at',{ascending:false}).limit(300),
    sb.from('devices').select('*').order('created_at',{ascending:false}),
    sb.from('topup_requests').select('*').order('created_at',{ascending:false}).limit(100),
    sb.from('wallet_transactions').select('*').order('created_at',{ascending:false}).limit(200),
    sb.rpc('dq_qr_recommendations'),
  ]);
  dqReady=!acc.error && !items.error;
  account=acc.data||{balance:0,status:'active',total_qr:0,total_spent:0};
  if(set.data) platform=set.data;
  cache.items=items.data||[]; cache.generations=gens.data||[]; cache.devices=devs.data||[];
  cache.topups=tops.data||[]; cache.wallet=wal.data||[]; cache.recs=recs.data||[];
  if(dqReady){ const {data:d}=await sb.rpc('dq_device_status',{p_key:deviceKey()}); myDevice=d||null; }
}

async function loginSubmit(e){
  e.preventDefault(); if(busy) return; busy=true;
  const idf=document.getElementById('lu').value.trim(), pass=document.getElementById('lp').value;
  const err=document.getElementById('loginErr'); err.textContent='';
  try{
    let email=idf;
    if(!idf.includes('@')){
      const {data}=await sb.from('username_directory').select('email').eq('username',idf.toLowerCase()).maybeSingle();
      if(!data){ err.textContent='No account found with that username.'; return; }
      email=data.email;
    }
    const {error}=await sb.auth.signInWithPassword({email,password:pass});
    if(error){ err.textContent='Incorrect username/email or password.'; return; }
    const {data:{session:s}}=await sb.auth.getSession(); session=s;
    await loadMember();
  } finally { busy=false; }
}
async function registerSubmit(e){
  e.preventDefault(); if(busy) return; busy=true;
  const err=document.getElementById('regErr'); err.textContent='';
  try{
    const bizName=document.getElementById('rb').value.trim(), ownerName=document.getElementById('rn').value.trim();
    const email=document.getElementById('re').value.trim(), pass=document.getElementById('rp').value, pass2=document.getElementById('rp2').value;
    if(pass!==pass2){ err.textContent='Passwords do not match.'; return; }
    if(pass.length<6){ err.textContent='Password must be at least 6 characters.'; return; }
    if(!session){
      const {data:signData,error:signErr}=await sb.auth.signUp({email,password:pass});
      if(signErr){ err.textContent=signErr.message; return; }
      if(!signData.session){ toast('Check your email to confirm your account, then sign in.'); authMode='login'; view='login'; render(); return; }
      session=signData.session;
    }
    const {data:biz,error:bizErr}=await sb.from('businesses').insert({name:bizName, short:bizName.replace(/[^A-Za-z]/g,'').slice(0,3).toUpperCase()||'BIZ', owner_auth_id:session.user.id, currency:'TZS'}).select().single();
    if(bizErr){ err.textContent=bizErr.message; return; }
    const {error:memErr}=await sb.from('members').insert({business_id:biz.id, auth_user_id:session.user.id, name:ownerName, role:'owner'});
    if(memErr){ err.textContent=memErr.message; return; }
    await sb.from('shops').insert([{business_id:biz.id, name:'Main Store', type:'warehouse'},{business_id:biz.id, name:'Main Shop', type:'shop'}]);
    await sb.from('categories').insert([{business_id:biz.id,name:'General'},{business_id:biz.id,name:'Electronics'},{business_id:biz.id,name:'Food & Beverage'},{business_id:biz.id,name:'Household'}]);
    toast('Welcome to DeepQr! Setting up your workspace…','ok');
    await loadMember();
  } finally { busy=false; }
}
async function adminClaimSubmit(e){
  e.preventDefault(); if(busy) return; busy=true;
  const err=document.getElementById('admErr'); err.textContent='';
  try{
    const email=document.getElementById('ae').value.trim(), pass=document.getElementById('ap').value, code=document.getElementById('ac').value.trim();
    let {error}=await sb.auth.signInWithPassword({email,password:pass});
    if(error){
      const r=await sb.auth.signUp({email,password:pass});
      if(r.error){ err.textContent=r.error.message; return; }
      if(!r.data.session){ err.textContent='Account created — confirm your email, then come back and activate.'; return; }
    }
    const {data:{session:s}}=await sb.auth.getSession(); session=s;
    const {data:ok,error:cErr}=await sb.rpc('dq_claim_platform_admin',{p_code:code});
    if(cErr||!ok){ err.textContent=cErr?errMsg(cErr):'That activation code is not valid for this email.'; await sb.auth.signOut(); session=null; return; }
    toast('Platform portal activated','ok');
    await loadMember();
  } finally { busy=false; }
}

/* ---------------- DASHBOARD ---------------- */
function linesForProduct(code){const p=product(code); if(!p) return []; return cache.saleLines.filter(l=>l.product_id===p.id&&saleOk(l.sale_id))}
function saleOk(id){const s=cache.sales.find(x=>x.id===id); return s&&s.status!=='refunded'}
function liveSales(){return cache.sales.filter(s=>s.status!=='refunded')}
function dashboard(){
  const today=dateOnly(), sales=liveSales().filter(s=>s.date===today&&(me.role!=='cashier'||s.shop_id===me.shop_id));
  const rev=sales.reduce((a,s)=>a+Number(s.total),0);
  const month=dateOnly().slice(0,7), mSales=liveSales().filter(s=>s.date.startsWith(month)), mRev=mSales.reduce((a,s)=>a+Number(s.total),0);
  const low=[]; visibleStores().forEach(st=>cache.products.forEach(p=>{const q=stock(st.id,p.code); if(q<=threshold(p)) low.push({st,p,q});}));
  const units=cache.products.reduce((a,p)=>a+cache.shops.reduce((b,s)=>b+stock(s.id,p.code),0),0);
  const tagged=cache.items.length, coverage=units?Math.min(100,Math.round(tagged/units*100)):0;
  const top=[...cache.products].map(p=>({p,n:linesForProduct(p.code).reduce((a,l)=>a+Number(l.qty),0)})).filter(x=>x.n).sort((a,b)=>b.n-a.n).slice(0,6);
  const exp=expiredCount(), soon=expiringCount()-exp;
  const recTotal=cache.recs.reduce((a,r)=>a+Number(r.recommended||0),0);
  return `<div class="grid g4">
   ${kpi('receipt','Today\'s sales',money(rev),`${sales.length} receipt(s)`)}
   ${kpi('chart','This month',money(mRev),`${mSales.length} receipt(s)`,'teal')}
   ${kpi('qr','QR coverage',coverage+'%',`${tagged} of ${units} units tagged`,'teal')}
   ${kpi('clock','Expiry alerts',`<span class="${exp?'bad':soon?'warn':''}">${exp+soon}</span>`,`${exp} expired · ${soon} expiring soon`,exp?'bad':'warn')}
  </div>
  ${dqReady&&recTotal&&canQR()?`<div class="banner info" style="margin-top:16px">${icon('spark')}<div style="flex:1"><b>${recTotal} stock unit(s) have no QR code yet</b><p>Estimated cost ${money(recTotal*Number(platform.qr_fee||25),platform.currency)} at ${money(platform.qr_fee,platform.currency)} per code. Tag them so every sale is scanned and traceable.</p></div><button class="btn primary small" onclick="go('qr')">Review recommendations</button></div>`:''}
  <div class="split" style="margin-top:16px"><div class="card"><div class="cardHead"><div><h3>Sales — last 7 days</h3><p>Completed receipts, refunds excluded</p></div></div>${salesChart()}</div>
  <div class="card"><div class="cardHead"><div><h3>Top products</h3><p>Units sold</p></div></div>${top.length?top.map((x,i)=>`<div class="row"><span>${i+1}. ${esc(x.p.name)}</span><b class="num">${x.n}</b></div>`).join(''):'<p class="muted">No sales yet.</p>'}</div></div>
  <div class="grid g2"><div class="card"><div class="cardHead"><div><h3>Stock alerts</h3><p>Low or out of stock</p></div><button class="btn small" onclick="go('${me.role==='cashier'?'myStock':'inventory'}')">Inventory</button></div>${low.slice(0,8).map(x=>`<div class="row"><span>${esc(x.p.name)} <small class="muted">· ${esc(x.st.name)}</small></span><span class="tag ${x.q?'low':'out'}">${x.q} left</span></div>`).join('')||'<p class="muted">Everything is sufficiently stocked.</p>'}</div>
  <div class="card"><div class="cardHead"><div><h3>Recent activity</h3><p>Latest movements</p></div></div>${cache.activity.slice(0,8).map(a=>`<div class="row" style="display:block"><b style="font-weight:600">${esc(a.description)}</b><div class="muted" style="font-size:11.5px">${fmtDT(a.created_at)} · ${esc(a.by_name)}</div></div>`).join('')||'<p class="muted">No activity yet.</p>'}</div></div>`;
}
function kpi(ic,label,value,sub,tone=''){return `<div class="kpi"><div class="k"><span class="ico ${tone}">${icon(ic)}</span>${label}</div><div class="v">${value}</div><div class="s">${sub||''}</div></div>`}
function salesChart(){let vals=[];for(let i=6;i>=0;i--){const ds=addDays(-i);vals.push({d:ds,v:liveSales().filter(s=>s.date===ds&&(me.role!=='cashier'||s.shop_id===me.shop_id)).reduce((a,s)=>a+Number(s.total),0)})}const max=Math.max(...vals.map(x=>x.v),1);return `<div class="chart">${vals.map(x=>`<div class="bar" style="height:${Math.max(4,x.v/max*88)}%"><i>${x.v?Math.round(x.v).toLocaleString():''}</i><span>${new Date(x.d+'T00:00').toLocaleDateString([], {weekday:'short'})}</span></div>`).join('')}</div>`}

function expiryTag(ds){const d=daysUntil(ds); if(d===null) return ''; if(d<0) return `<span class="tag bad">Expired ${-d}d ago</span>`; if(d===0) return `<span class="tag bad">Expires today</span>`; if(d<=7) return `<span class="tag warn">${d} day(s) left</span>`; if(d<=Number(business?.expiry_alert_days||30)) return `<span class="tag warn">${d} days left</span>`; return `<span class="tag ok">${ds}</span>`}
function expiryGroups(){
  const map={};
  cache.items.filter(i=>i.expiry_date&&(me.role!=='cashier'||i.shop_id===me.shop_id)).forEach(i=>{const k=i.product_id+'|'+i.shop_id+'|'+i.expiry_date; (map[k]=map[k]||{product_id:i.product_id,shop_id:i.shop_id,expiry_date:i.expiry_date,items:[]}).items.push(i)});
  const lot={}; cache.purchases.filter(p=>p.expiry_date).forEach(p=>{const k=p.product_id+'|'+p.shop_id+'|'+p.expiry_date; if(!map[k]) (lot[k]=lot[k]||{product_id:p.product_id,shop_id:p.shop_id,expiry_date:p.expiry_date,items:[],qty:0}).qty+=Number(p.qty)});
  return [...Object.values(map),...Object.values(lot)].sort((a,b)=>a.expiry_date.localeCompare(b.expiry_date));
}

  const days=Number(business?.expiry_alert_days||30), all=expiryGroups();
  const exp=all.filter(g=>daysUntil(g.expiry_date)<0), week=all.filter(g=>{const d=daysUntil(g.expiry_date);return d>=0&&d<=7}), soon=all.filter(g=>{const d=daysUntil(g.expiry_date);return d>7&&d<=days});
  const list={attention:[...exp,...week,...soon],expired:exp,week,soon:[...week,...soon],all}[expiryFilter]||all;
  const cnt=a=>a.reduce((s,g)=>s+(g.items.length||g.qty||0),0);
  return `<div class="grid g4">${kpi('alert','Expired',`<span class="bad">${cnt(exp)}</span>`,'items still in stock','bad')}${kpi('clock','Within 7 days',`<span class="warn">${cnt(week)}</span>`,'sell or discount now','warn')}${kpi('clock',`Within ${days} days`,cnt(soon)+cnt(week),'alert window')}${kpi('shield','Expired sales',business.block_expired_sales?'Blocked':'Allowed',business.block_expired_sales?'Scanner refuses expired items':'Warning only','teal')}</div>

async function voidExpired(ids,name){

async function doTransfer(e){
  e.preventDefault();
  const from=me.role==='cashier'?me.shop_id:document.getElementById('tf').value, to=document.getElementById('tt').value, p=product(document.getElementById('tp').value.trim()), q=Number(document.getElementById('tq').value);
  if(from===to||!p||q<1||q>stock(from,p.code)){ toast('Check source, destination, product and available stock','bad'); return; }
  setStockLocal(from,p.code,stock(from,p.code)-q); await persistStock(from,p.code,stock(from,p.code));
  const {data}=await sb.from('transfers').insert({business_id:me.business_id,from_shop:from,to_shop:to,product_id:p.id,qty:q,note:document.getElementById('tn').value.trim(),by_name:me.name,status:'pending'}).select().single();
  cache.transfers.unshift(data);
  await logActivity('transfer',`${q} × ${p.name} sent from ${shopObj(from)?.name} to ${shopObj(to)?.name} — pending receipt`);
  renderView(); toast('Transfer sent','ok');
}
async function confirmTransferReceipt(id){
  const t=cache.transfers.find(x=>x.id===id); if(!t||t.status!=='pending') return;
  if(!(can('manager')||t.to_shop===me.shop_id)){ toast('Only the receiving shop or a manager can confirm.','bad'); return; }
  const p=productById(t.product_id); if(!p) return;
  setStockLocal(t.to_shop,p.code,stock(t.to_shop,p.code)+Number(t.qty)); await persistStock(t.to_shop,p.code,stock(t.to_shop,p.code));
  const patch={status:'completed',received_by:me.name,received_at:new Date().toISOString()};
  await sb.from('transfers').update(patch).eq('id',id); Object.assign(t,patch);
  await logActivity('transfer',`${t.qty} × ${p.name} received at ${shopObj(t.to_shop)?.name}`);
  renderView(); toast('Receipt confirmed — stock updated','ok');
}

/* ---------------- POS: scan → cart → receipt ---------------- */
function activeShopId(){ return me.role==='cashier'?me.shop_id:(storeFilter==='all'?(cache.shops.find(s=>s.type==='shop')?.id||cache.shops[0]?.id):storeFilter); }
function allowedModes(){
  // business rule first, then (when devices are locked) the approved device's own type
  const bm=business?.scan_mode||'both';
  let cam=bm!=='hardware', hw=bm!=='camera';
  if(business?.device_lock&&myDevice&&myDevice.status==='approved'){
    if(myDevice.kind==='smartphone') hw=false;
    if(myDevice.kind==='scanner') cam=false;
  }
  return {cam,hw};
}
function deviceBlocked(){
  if(!dqReady||!business?.device_lock) return null;
  if(!myDevice) return 'unregistered';
  if(myDevice.status!=='approved') return myDevice.status;
  if(myDevice.shop_id&&me.role==='cashier'&&myDevice.shop_id!==me.shop_id) return 'wrongshop';
  return null;
}
function cartTotals(){
  const sub=cart.reduce((a,l)=>a+l.qty*l.price,0), tax=cart.reduce((a,l)=>a+l.qty*l.price*(l.tax||0)/100,0);
  const disc=Math.max(0,Number(document.getElementById('cDisc')?.value||window.__disc||0));
  return {sub,tax,disc,total:Math.max(0,sub+tax-disc)};
}

    <div class="scanZone" id="scanZone"><div class="bigIco">${icon('qr')}</div><b style="font-size:16px">Scan an item QR code</b><div class="muted" style="font-size:13px">Each item is added to the cart. Scan everything, then create the receipt.</div>
     ${m.hw||!m.cam?`<form id="scanForm" class="scanInput"><input id="scanInput" autocomplete="off" placeholder="Scan or type serial / code…"><button class="btn primary">Add</button></form>`:''}
     ${m.cam?`<button class="btn ${m.hw?'':'primary'} lg" style="margin-top:12px" onclick="openCameraModal()">${icon('camera')}Scan with camera</button>`:''}
     <div class="lastScan" id="lastScan"></div></div></div>
   <div class="card"><div class="cardHead"><div><h3>Quick add</h3><p>Products without QR labels can be added by quantity.</p></div></div>
    <div class="searchLine"><input class="input" id="posSearchInput" placeholder="Search products…"></div><div class="prodGrid" id="posProducts">${posProducts('')}</div></div>

  <div class="card cart" id="cartCard">${cartHtml()}</div></div>

function mobileBarHtml(){const n=cart.reduce((a,l)=>a+l.qty,0); return `<span>${icon('cart')} Cart · ${n} item(s)</span><span>${money(cartTotals().total)} →</span>`}
function cartHtml(){
  const t=cartTotals(), n=cart.reduce((a,l)=>a+l.qty,0);
  return `<div class="cardHead"><div><h3>Cart</h3><p>${n} item(s) · ${cart.length} line(s)</p></div>${cart.length?`<button class="btn small danger" onclick="clearCart()">${icon('trash')}Clear</button>`:''}</div>

function posProducts(q){
  const shop=shopObj(activeShopId()); if(!shop) return '';
  return cache.products.filter(p=>{const st=stock(shop.id,p.code); return st>0 && (p.name+' '+p.code+' '+p.barcode).toLowerCase().includes((q||'').toLowerCase())}).slice(0,24)
    .map(p=>`<button class="prodBtn" onclick="scanLookup('${jsq(p.code)}')"><b>${esc(p.name)}</b><small>${esc(p.code)} · ${stock(shop.id,p.code)} left</small><div style="font-weight:800;margin-top:4px">${money(p.price)}</div></button>`).join('')||'<p class="muted">No matching stock at this shop.</p>';

function flashScan(ok,msg){
  const z=document.getElementById('scanZone'), l=document.getElementById('lastScan');
  if(z){ z.classList.remove('flash-ok','flash-bad'); void z.offsetWidth; z.classList.add(ok?'flash-ok':'flash-bad'); setTimeout(()=>z.classList.remove('flash-ok','flash-bad'),700); }
  if(l) l.innerHTML=(ok?'<span class="ok">✔ </span>':'<span class="bad">✖ </span>')+esc(msg);
  beep(ok);
}
let scanBusy=false;
async function scanLookup(value){
  value=String(value||'').trim(); if(!value||scanBusy) return;
  const shopId=activeShopId();
  const looksQR=value.startsWith('DQ1|')||/^\d{9,}$/.test(value)||/^[^\s]+-\d{9,}$/.test(value);
  if(looksQR&&dqReady){
    if(cart.some(l=>l.items?.some(it=>it.serial===value||it.payload===value))){ flashScan(false,'Already in the cart: '+value); return; }
    scanBusy=true;
    try{
      const {data,error}=await sb.rpc('dq_lookup_item',{p_code:value,p_shop_id:shopId,p_device_key:deviceKey()});
      if(error){ flashScan(false,errMsg(error)); toast(errMsg(error),'bad'); return; }
      if(!data||data.reason==='NOT_FOUND'){ if(!value.startsWith('DQ1|')&&product(value)){ addQtyProduct(product(value)); return; } flashScan(false,'Unknown QR code: '+value); return; }
      if(data.reason==='OTHER_BUSINESS'){ flashScan(false,data.message); return; }
      const it=data.item, p=data.product;
      if(data.reason==='SOLD'){ flashScan(false,`${p.name} ${it.serial} was already sold`); return; }
      if(data.reason==='VOID'){ flashScan(false,`${it.serial} label was voided`); return; }
      if(data.expired&&!data.ok){ flashScan(false,`${p.name} ${it.serial} EXPIRED on ${it.expiry_date} — do not sell`); toast(`Expired item blocked: ${p.name} (${it.expiry_date})`,'bad'); return; }
      if(cart.some(l=>l.items?.some(x=>x.id===it.id))){ flashScan(false,'Already in the cart: '+it.serial); return; }
      const inCart=cart.filter(l=>l.product_id===p.id).reduce((a,l)=>a+l.qty,0);
      if(inCart+1>stock(shopId,p.code)){ flashScan(false,`Stock record for ${p.name} at this shop is ${stock(shopId,p.code)} — adjust inventory first`); return; }
      let line=cart.find(l=>l.product_id===p.id&&l.items);
      if(!line){ line={product_id:p.id,code:p.code,name:p.name,price:Number(p.price),tax:Number(p.tax||0),qty:0,items:[]}; cart.push(line); }
      line.items.push({id:it.id,serial:it.serial,payload:it.qr_payload}); line.qty=line.items.length;
      const warn=data.other_shop?` (labelled for ${shopObj(it.shop_id)?.name||'another shop'})`:'';
      const dd=it.expiry_date?daysUntil(it.expiry_date):null;
      flashScan(true,`${p.name} · ${it.serial} · ${money(p.price)}${warn}${dd!==null&&dd<=7?` · expires in ${dd} day(s)`:''}`);
      updateCart();
    } finally { scanBusy=false; }
    return;
  }
  const p=product(value) || cache.products.find(x=>(x.name+' '+x.code).toLowerCase().includes(value.toLowerCase()));
  if(!p){ flashScan(false,'No product or QR matches "'+value+'"'); return; }
  addQtyProduct(p);
}
function addQtyProduct(p){
  const shopId=activeShopId(), avail=stock(shopId,p.code), inCart=cart.filter(l=>l.product_id===p.id).reduce((a,l)=>a+l.qty,0);
  if(inCart+1>avail){ flashScan(false,`Not enough stock of ${p.name} (${avail} at this shop)`); return; }
  let line=cart.find(l=>l.product_id===p.id&&!l.items);
  if(line) line.qty++; else cart.push({product_id:p.id,code:p.code,name:p.name,price:Number(p.price),tax:Number(p.tax||0),qty:1});
  flashScan(true,`${p.name} added by quantity (no QR)`); updateCart();
}
function removeSerial(i,id){const l=cart[i]; l.items=l.items.filter(x=>x.id!==id); l.qty=l.items.length; if(!l.qty) cart.splice(i,1); updateCart();}
function changeCart(i,v){
  const l=cart[i], n=Math.max(0,Math.floor(Number(v)||0)); if(!n){ cart.splice(i,1); updateCart(); return; }
  const other=cart.filter((x,j)=>j!==i&&x.product_id===l.product_id).reduce((a,x)=>a+x.qty,0);
  if(n+other>stock(activeShopId(),l.code)){ toast('Not enough stock','bad'); updateCart(); return; }
  l.qty=n; updateCart();
}
async function completeSale(){
  if(!cart.length||busy) return;
  const t=cartTotals(), pay=document.getElementById('cPay')?.value||'Cash', paidRaw=document.getElementById('cPaid')?.value;
  const paid=paidRaw?Number(paidRaw):null;
  if(paid!==null&&pay==='Cash'&&paid<t.total){ toast('Amount received is less than the total','bad'); return; }
  busy=true;
  try{
    const sid=activeShopId(), customer=document.getElementById('cName')?.value.trim()||'Walk-in', phone=document.getElementById('cPhone')?.value.trim()||null;
    if(dqReady){
      const lines=[]; cart.forEach(l=>{ if(l.items) l.items.forEach(it=>lines.push({item_id:it.id})); else lines.push({product_id:l.product_id,qty:l.qty,price:l.price}); });
      const {data,error}=await sb.rpc('dq_checkout',{p_shop_id:sid,p_lines:lines,p_customer:customer,p_phone:phone,p_payment:pay,p_discount:t.disc,p_paid:paid,p_device_key:deviceKey(),p_date:dateOnly(),p_time:timeNow()});
      if(error){ toast(errMsg(error),'bad'); beep(false); return; }
      const sale=data.sale, lineRows=data.lines||[];
      cache.sales.unshift(sale); cache.saleLines.push(...lineRows);
      const byProd={}; lineRows.forEach(l=>byProd[l.product_id]=(byProd[l.product_id]||0)+Number(l.qty));
      Object.entries(byProd).forEach(([pid,q])=>{const p=productById(pid); if(p) setStockLocal(sid,p.code,stock(sid,p.code)-q)});
      const sold=new Set(lineRows.filter(l=>l.item_id).map(l=>l.item_id)); cache.items=cache.items.filter(i=>!sold.has(i.id));
      cache.activity.unshift({description:`Sale ${sale.receipt}: ${money(sale.total)}`,by_name:me.name,created_at:new Date().toISOString()});
      cart=[]; window.__disc=''; window.__paid=''; window.__cName=''; window.__cPhone='';
      renderView(); showReceipt(sale,lineRows); beep(true);
      refreshRecs();
    } else {
      // legacy path (DeepQr database update not applied yet)
      const receipt='R-'+Date.now().toString().slice(-7);
      const {data:sale,error}=await sb.from('sales').insert({business_id:me.business_id,shop_id:sid,receipt,date:dateOnly(),time:timeNow(),subtotal:t.sub,tax:t.tax,total:t.sub+t.tax,payment:pay,customer,cashier_name:me.name}).select().single();
      if(error){ toast(error.message,'bad'); return; }
      const lineRows=cart.map(l=>({sale_id:sale.id,business_id:me.business_id,product_id:l.product_id,name:l.name,code:l.code,qty:l.qty,price:l.price,tax:l.tax}));
      await sb.from('sale_lines').insert(lineRows); cache.sales.unshift(sale); cache.saleLines.push(...lineRows);
      for(const l of cart){ setStockLocal(sid,l.code,stock(sid,l.code)-l.qty); await persistStock(sid,l.code,stock(sid,l.code)); }
      await logActivity('sale',`Sale ${receipt}: ${money(sale.total)} at ${shopObj(sid)?.name}`);
      cart=[]; renderView(); showReceipt(sale,lineRows);
    }
  } finally { busy=false; }
}
function showReceipt(s, lines){
  const l=lines||linesFor(s.id);
  const groups={}; l.forEach(x=>{const k=x.product_id+'|'+x.price; (groups[k]=groups[k]||{name:x.name,price:Number(x.price),qty:0,serials:[]}); groups[k].qty+=Number(x.qty); if(x.serial) groups[k].serials.push(x.serial)});
  modal(`<div class="actions noPrint" style="justify-content:flex-end;margin-bottom:12px"><button class="btn" onclick="closeModal()">Close</button><button class="btn primary" onclick="printModal()">${icon('printer')}Print receipt</button></div>

  <div class="dash"></div><div style="display:flex;justify-content:space-between"><span>Receipt</span><b class="mono">${esc(s.receipt)}</b></div><div style="display:flex;justify-content:space-between"><span>Date</span><span>${s.date} ${esc(s.time||'')}</span></div><div style="display:flex;justify-content:space-between"><span>Cashier</span><span>${esc(s.cashier_name||'')}</span></div><div style="display:flex;justify-content:space-between"><span>Customer</span><span>${esc(s.customer||'')}${s.customer_phone?' · '+esc(s.customer_phone):''}</span></div>
  <div class="dash"></div><table>${Object.values(groups).map(g=>`<tr><td>${esc(g.name)}<br><span class="ser">${g.qty} × ${money(g.price)}${g.serials.length?'<br>SN '+g.serials.map(esc).join(', '):''}</span></td><td class="right" style="vertical-align:top">${money(g.qty*g.price)}</td></tr>`).join('')}</table>
  <div class="dash"></div><table><tr><td>Subtotal</td><td class="right">${money(s.subtotal)}</td></tr><tr><td>Tax</td><td class="right">${money(s.tax)}</td></tr>${Number(s.discount)?`<tr><td>Discount</td><td class="right">− ${money(s.discount)}</td></tr>`:''}<tr><th style="font-size:15px">TOTAL</th><th class="right" style="font-size:15px">${money(s.total)}</th></tr><tr><td>Paid (${esc(s.payment)})</td><td class="right">${s.amount_paid!=null?money(s.amount_paid):money(s.total)}</td></tr>${s.change_due!=null&&Number(s.change_due)>0?`<tr><td>Change</td><td class="right">${money(s.change_due)}</td></tr>`:''}</table>
  ${s.status==='refunded'?'<div style="text-align:center;font-weight:800;color:#DC2626;margin-top:8px">REFUNDED</div>':''}

}
function linesFor(saleId){return cache.saleLines.filter(l=>l.sale_id===saleId)}

/* ---- camera scanning ---- */
function openCameraModal(){
  modal(`<div class="cardHead"><div><h3>Camera scanner</h3><p>Point at an item QR code. Each successful scan is added to the cart — keep scanning.</p></div><button class="btn ghost" onclick="closeModal()">${icon('x')}</button></div><div id="reader" style="width:100%;min-height:260px;border-radius:12px;overflow:hidden;background:#000"></div><div id="cameraStatus" class="muted" style="margin-top:10px;text-align:center">Starting camera…</div><div id="camLast" style="text-align:center;font-weight:700;min-height:22px;margin-top:6px"></div>
  <div class="actions" style="justify-content:center;margin-top:10px"><button class="btn primary" onclick="closeModal()">${icon('check')}Done — view cart</button></div>`);
  startCameraScan();
}
function startCameraScan(){
  if(!window.Html5Qrcode){ document.getElementById('cameraStatus').textContent='Camera scanner library failed to load.'; return; }
  if(scanner) return;
  let last='', lastAt=0;
  scanner=new Html5Qrcode('reader',{formatsToSupport:[Html5QrcodeSupportedFormats.QR_CODE,Html5QrcodeSupportedFormats.CODE_128,Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.EAN_8,Html5QrcodeSupportedFormats.UPC_A],verbose:false});
  const onDecode=async(text)=>{
    const now=Date.now(); if(text===last&&now-lastAt<2500) return; last=text; lastAt=now;
    await scanLookup(text);
    const cl=document.getElementById('camLast'), ls=document.getElementById('lastScan'); if(cl&&ls) cl.innerHTML=ls.innerHTML;
  };
  const tryStart=c=>scanner.start(c,{fps:12,qrbox:{width:240,height:240}},onDecode,()=>{});
  tryStart({facingMode:{ideal:'environment'}}).then(()=>{const st=document.getElementById('cameraStatus'); if(st) st.textContent='Scanning… hold the QR steady inside the frame.';})
   .catch(()=>tryStart({facingMode:'user'}).then(()=>{const st=document.getElementById('cameraStatus'); if(st) st.textContent='Scanning with front camera…';}).catch(()=>{const st=document.getElementById('cameraStatus'); if(st) st.textContent='Camera unavailable — allow camera access in the browser, or use the scan box.';}));
}
function stopCameraScan(){ if(scanner){ const s=scanner; scanner=null; s.stop().then(()=>s.clear()).catch(()=>{}); } }

async function updateDevice(id,ch){

function showReceiptById(id){ const s=cache.sales.find(x=>x.id===id); if(s) showReceipt(s); }
async function refundSale(id){
  const s=cache.sales.find(x=>x.id===id); if(!s) return;
  const reason=prompt(`Refund receipt ${s.receipt} (${money(s.total)})?\nItems go back into stock and their QR codes become sellable again.\n\nReason:`,'Customer return');
  if(reason===null) return;
  const {error}=await sb.rpc('dq_refund_sale',{p_sale_id:id,p_reason:reason});
  if(error){ toast(errMsg(error),'bad'); return; }
  s.status='refunded'; s.refund_reason=reason; s.refunded_by=me.name;
  linesFor(id).forEach(l=>{const p=productById(l.product_id); if(p) setStockLocal(s.shop_id,p.code,stock(s.shop_id,p.code)+Number(l.qty))});
  await loadDeepQr(); renderView(); toast('Sale refunded — stock restored','ok');
}
function exportSales(){
  const rows=[['Receipt','Date','Time','Location','Customer','Phone','Cashier','Payment','Product','Code','Serial','Qty','Price','Line total','Receipt total','Status']];

/* ---------------- REPORTS ---------------- */
function monthName(m){return ['January','February','March','April','May','June','July','August','September','October','November','December'][m-1]}
function salesInRange(a,b){return liveSales().filter(s=>s.date>=a&&s.date<=b&&(reportShop==='all'||s.shop_id===reportShop))}
function salesInMonth(y,m){return salesInRange(`${y}-${pad(m)}-01`,`${y}-${pad(m)}-31`)}
function salesInYear(y){return salesInRange(`${y}-01-01`,`${y}-12-31`)}
function salesInQuarter(y,q){return salesInRange(`${y}-${pad(q*3-2)}-01`,`${y}-${pad(q*3)}-31`)}
function bestSellers(list,limit=10){const ids=new Set(list.map(s=>s.id)),by={};cache.saleLines.filter(l=>ids.has(l.sale_id)).forEach(l=>{by[l.code]=by[l.code]||{name:l.name,qty:0,revenue:0};by[l.code].qty+=Number(l.qty);by[l.code].revenue+=Number(l.qty)*Number(l.price)});return Object.values(by).sort((a,b)=>b.qty-a.qty).slice(0,limit)}
function reportSummary(list){const ids=new Set(list.map(s=>s.id)), lines=cache.saleLines.filter(l=>ids.has(l.sale_id)); const rev=list.reduce((a,s)=>a+Number(s.total),0); const gross=lines.reduce((a,l)=>a+Number(l.qty)*(Number(l.price)-(productById(l.product_id)?.cost||0)),0)-list.reduce((a,s)=>a+Number(s.discount||0),0); return {rev,gross,count:list.length}}
function setReportPeriod(f,v){ if(f==='month') reportMonth=Number(v); else if(f==='year') reportYear=Number(v); else if(f==='shop') reportShop=v; else if(f==='type') reportType=v; else if(f==='quarter') reportQuarter=Number(v); renderView(); }
function reportsView(){
  const isCashier=me.role==='cashier'; if(isCashier) reportShop=me.shop_id;
  const list=reportType==='month'?salesInMonth(reportYear,reportMonth):reportType==='quarter'?salesInQuarter(reportYear,reportQuarter):salesInYear(reportYear);
  const sum=reportSummary(list), top=bestSellers(list,10);
  const [a,b]=reportType==='month'?[`${reportYear}-${pad(reportMonth)}-01`,`${reportYear}-${pad(reportMonth)}-31`]:reportType==='quarter'?[`${reportYear}-${pad(reportQuarter*3-2)}-01`,`${reportYear}-${pad(reportQuarter*3)}-31`]:[`${reportYear}-01-01`,`${reportYear}-12-31`];
  const exps=cache.expenses.filter(e=>e.date>=a&&e.date<=b&&(reportShop==='all'||e.shop_id===reportShop)).reduce((x,e)=>x+Number(e.amount),0);
  const qrSpend=cache.generations.filter(g=>dateOnly(g.created_at)>=a&&dateOnly(g.created_at)<=b).reduce((x,g)=>x+Number(g.total),0);
  const years=[...new Set(cache.sales.map(s=>Number(s.date.slice(0,4))))]; if(!years.includes(reportYear)) years.push(reportYear); years.sort();
  const scope=reportShop==='all'?'Whole business':esc(shopObj(reportShop)?.name||'');
  const label=reportType==='month'?`${monthName(reportMonth)} ${reportYear}`:reportType==='quarter'?`Q${reportQuarter} ${reportYear}`:`${reportYear}`;
  const months=reportType==='year'?Array.from({length:12},(_,i)=>i+1):reportType==='quarter'?[reportQuarter*3-2,reportQuarter*3-1,reportQuarter*3]:[];
  const mv=months.map(m=>({m,v:reportSummary(salesInMonth(reportYear,m)).rev})), mx=Math.max(1,...mv.map(x=>x.v));
  return `<div class="card noPrint"><div class="formGrid">
   <div class="field"><label>Report type</label><select onchange="setReportPeriod('type',this.value)">${[['month','Monthly'],['quarter','Quarterly'],['year','Yearly']].map(([k,l])=>`<option value="${k}" ${reportType===k?'selected':''}>${l}</option>`).join('')}</select></div>
   ${reportType==='month'?`<div class="field"><label>Month</label><select onchange="setReportPeriod('month',this.value)">${Array.from({length:12},(_,i)=>i+1).map(m=>`<option value="${m}" ${m===reportMonth?'selected':''}>${monthName(m)}</option>`).join('')}</select></div>`:''}
   ${reportType==='quarter'?`<div class="field"><label>Quarter</label><select onchange="setReportPeriod('quarter',this.value)">${[1,2,3,4].map(q=>`<option value="${q}" ${q===reportQuarter?'selected':''}>Q${q}</option>`).join('')}</select></div>`:''}
   <div class="field"><label>Year</label><select onchange="setReportPeriod('year',this.value)">${years.map(y=>`<option ${y===reportYear?'selected':''}>${y}</option>`).join('')}</select></div>
   ${isCashier?'':`<div class="field"><label>Location</label><select onchange="setReportPeriod('shop',this.value)"><option value="all">Whole business</option>${cache.shops.map(s=>`<option value="${s.id}" ${reportShop===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div>`}
  </div></div>
  <div class="card"><div class="cardHead"><div><h3>${label} — ${scope}</h3><p>Refunded receipts excluded · gross profit uses current product cost</p></div></div>
   <div class="grid g4">${kpi('chart','Revenue',money(sum.rev),`${sum.count} receipt(s)`)}${kpi('spark','Gross profit',`<span class="ok">${money(sum.gross)}</span>`,'after discounts','teal')}${kpi('minus','Expenses',`<span class="bad">${money(exps)}</span>`,`incl. QR spend ${money(qrSpend,platform.currency)}`,'bad')}${kpi('wallet','Net',money(sum.gross-exps-qrSpend),'gross − expenses − QR')}</div>
   ${months.length?`<div class="chart" style="margin-top:16px">${mv.map(x=>`<div class="bar" style="height:${Math.max(3,x.v/mx*88)}%"><i>${x.v?Math.round(x.v).toLocaleString():''}</i><span>${monthName(x.m).slice(0,3)}</span></div>`).join('')}</div>`:''}</div>
  <div class="grid g2"><div class="card"><div class="cardHead"><div><h3>Best sellers</h3></div></div>${top.length?`<div class="tableWrap"><table style="min-width:0"><thead><tr><th>#</th><th>Product</th><th class="right">Units</th><th class="right">Revenue</th></tr></thead><tbody>${top.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.name)}</td><td class="right num">${x.qty}</td><td class="right num">${money(x.revenue)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">No sales in this period.</p>'}</div>
  ${isCashier?'':`<div class="card"><div class="cardHead"><div><h3>Revenue by location</h3></div></div>${cache.shops.map(s=>{const l=liveSales().filter(x=>x.date>=a&&x.date<=b&&x.shop_id===s.id), r=reportSummary(l); return `<div class="row"><span>${esc(s.name)} <small class="muted">${r.count} receipts</small></span><b class="num">${money(r.rev)}</b></div>`}).join('')}</div>`}</div>`;
}

  ${open.length?`<h3 style="margin:20px 0 10px">Open orders</h3>${open.map(card).join('')}`:''}${closed.length?`<h3 style="margin:20px 0 10px">Completed</h3>${closed.slice(0,10).map(card).join('')}`:''}`;
}
function addToOrderDraft(){
  const raw=document.getElementById('ordProd').value.trim(), p=product(raw)||cache.products.find(x=>x.name.toLowerCase()===raw.toLowerCase()), q=Number(document.getElementById('ordQty').value)||0;
  if(!p||q<1){ toast('Select a valid product and quantity','bad'); return; }
  const ex=orderDraft.find(l=>l.code===p.code); if(ex) ex.qty+=q; else orderDraft.push({product_id:p.id,code:p.code,name:p.name,qty:q}); renderView();
}
async function submitOrder(){
  if(!orderDraft.length) return;
  const shopId=document.getElementById('ordShop').value, ref=document.getElementById('ordRef').value.trim(), note=document.getElementById('ordNote')?.value.trim()||'';
  const {data:order,error}=await sb.from('orders').insert({business_id:me.business_id,shop_id:shopId,ref,note,status:'pending',created_by:me.name}).select().single();
  if(error){ toast(error.message,'bad'); return; }
  const {data:items,error:ie}=await sb.from('order_items').insert(orderDraft.map(l=>({order_id:order.id,business_id:me.business_id,product_id:l.product_id,shop_id:shopId,qty_ordered:l.qty,qty_received:0,status:'pending'}))).select();
  if(ie){ toast(ie.message,'bad'); return; }
  cache.orders.unshift(order); cache.orderItems.push(...items); await logActivity('order',`Order placed for ${shopObj(shopId)?.name}: ${orderDraft.length} product(s)`);
  orderDraft=[]; renderView(); toast('Order placed','ok');
}
async function fulfillOrderItems(productId,shopId,qty,receiver){
  const openItems=cache.orderItems.filter(it=>it.product_id===productId&&it.shop_id===shopId&&it.status==='pending'); let rem=qty;
  for(const it of openItems){ if(rem<=0) break; const need=it.qty_ordered-it.qty_received; if(need<=0) continue; const take=Math.min(need,rem); rem-=take; const nr=it.qty_received+take;
    const patch={qty_received:nr,status:nr>=it.qty_ordered?'received':'pending',received_by:receiver,received_at:new Date().toISOString()}; await sb.from('order_items').update(patch).eq('id',it.id); Object.assign(it,patch); }
  for(const oid of [...new Set(openItems.map(i=>i.order_id))]){ const items=cache.orderItems.filter(i=>i.order_id===oid); const st=items.every(i=>i.status==='received')?'received':items.some(i=>i.qty_received>0)?'partial':'pending'; const o=cache.orders.find(x=>x.id===oid); if(o&&o.status!==st){ o.status=st; await sb.from('orders').update({status:st}).eq('id',oid); } }
}
async function confirmOrderItem(itemId){
  const it=cache.orderItems.find(x=>x.id===itemId); if(!it) return;
  await sb.from('order_items').delete().eq('id',itemId); cache.orderItems=cache.orderItems.filter(x=>x.id!==itemId);
  if(!cache.orderItems.some(x=>x.order_id===it.order_id)){ await sb.from('orders').delete().eq('id',it.order_id); cache.orders=cache.orders.filter(o=>o.id!==it.order_id); }
  renderView();
}

async function adminCredit(id,name){
  const v=prompt(`Adjust wallet for ${name}.\nPositive amount = credit, negative = debit:`,'1000'); if(v===null) return;
  const amt=Number(v); if(!amt){ toast('Enter a non-zero amount','bad'); return; }
  const note=prompt('Note (shown on the business statement):','Manual adjustment')||'Manual adjustment';
  const {error}=await sb.rpc('dq_admin_adjust_wallet',{p_business:id,p_amount:amt,p_note:note,p_type:'adjustment'});
  if(error){ toast(errMsg(error),'bad'); return; }
  await loadAdmin(); renderView(); toast('Wallet updated','ok');
}
async function adminStatus(id,status,name){
  const note=status==='suspended'?prompt(`Suspend ${name}? They won't be able to sell or generate QR codes.\nReason (shown to the business):`,'Account under review'):'';
  if(note===null) return;
  const {error}=await sb.rpc('dq_admin_set_status',{p_business:id,p_status:status,p_note:note||null});
  if(error){ toast(errMsg(error),'bad'); return; }
  await loadAdmin(); renderView(); toast(status==='suspended'?'Business suspended':'Business activated','ok');
}
async function saveAdminSettings(e){
  e.preventDefault();
  const {data,error}=await sb.rpc('dq_admin_update_settings',{p_fee:Number(document.getElementById('sfee').value),p_currency:document.getElementById('scur').value,p_min_topup:Number(document.getElementById('smin').value),p_welcome_credit:Number(document.getElementById('swel').value),p_allow_negative:document.getElementById('sneg').checked,p_instructions:document.getElementById('sins').value});
  if(error){ toast(errMsg(error),'bad'); return; }
  adminData.settings=data; platform=data; renderView(); toast('Settings saved — new fee applies immediately','ok');
}

/* ---------------- modal helpers ---------------- */
function modal(html,size=''){const m=document.getElementById('modal'); m.innerHTML=`<div class="modal ${size}">${html}</div>`; m.classList.remove('hidden'); renderBarcodes();}
function closeModal(){const m=document.getElementById('modal'); m.classList.add('hidden'); m.innerHTML=''; editing=null; stopCameraScan(); if(view==='pos') setTimeout(()=>document.getElementById('scanInput')?.focus(),50);}
function printModal(){document.body.classList.add('printing-modal'); window.print(); setTimeout(()=>document.body.classList.remove('printing-modal'),500);}
document.getElementById('modal').addEventListener('click',e=>{ if(e.target.id==='modal') closeModal(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&!document.getElementById('modal').classList.contains('hidden')) closeModal(); });

/* ---------------- per-view bindings ---------------- */
function bindViewEvents(){
  const on=(id,ev,fn)=>{const el=document.getElementById(id); if(el) el.addEventListener(ev,fn);};
  on('adjForm','submit',adjustStock); on('storeForm','submit',addStore); on('transferForm','submit',doTransfer); on('purchaseForm','submit',receivePurchase);
  on('expenseForm','submit',addExpense); on('memberForm','submit',addMember); on('settingsForm','submit',saveSettings); on('categoryForm','submit',addCategory);
  on('devRegForm','submit',registerDevice); on('devRulesForm','submit',saveDeviceRules); on('topupForm','submit',submitTopup); on('admSettings','submit',saveAdminSettings);
  on('scanForm','submit',e=>{e.preventDefault(); const i=document.getElementById('scanInput'); const v=i.value; i.value=''; scanLookup(v); i.focus();});
  on('posSearchInput','input',e=>{document.getElementById('posProducts').innerHTML=posProducts(e.target.value)});
  if(view==='pos') setTimeout(()=>document.getElementById('scanInput')?.focus(),30);
}
/* hardware scanners: capture fast keystroke bursts on the POS even when the scan box isn't focused */
(function(){
  let buf='', lastT=0;
  document.addEventListener('keydown',e=>{
    if(view!=='pos'||!document.getElementById('modal').classList.contains('hidden')) return;
    const tag=(e.target.tagName||'').toLowerCase(); if(tag==='input'||tag==='textarea'||tag==='select') return;
    const now=Date.now(); if(now-lastT>60) buf=''; lastT=now;
    if(e.key==='Enter'){ if(buf.length>=6){ e.preventDefault(); scanLookup(buf); } buf=''; return; }
    if(e.key.length===1) buf+=e.key;
  });
})();
window.addEventListener('resize',applySidebarState);

boot();
